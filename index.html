<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misiones Educativas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.5s ease-out forwards;
        }
        
        @keyframes bounce-hover {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .hover\:animate-bounce-hover:hover {
            animation: bounce-hover 1s infinite;
        }

        .stars-bg {
            background-image: 
            radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
            radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
            radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
            radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
            radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
            radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
        }

        .card-container {
            perspective: 1000px;
        }
        .card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card-flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .card-back {
            transform: rotateY(180deg);
        }

        .view-section {
            display: none;
            width: 100%;
        }
        .view-section.active {
            display: block;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans selection:bg-orange-300 min-h-screen flex flex-col overflow-x-hidden">

    <!-- GLOBAL HEADER -->
    <header id="global-header" class="p-4 shadow-md text-white text-center relative z-50 transition-colors duration-500 bg-gradient-to-r from-indigo-600 to-purple-700">
        <button id="btn-back" onclick="goBack()" class="hidden absolute left-4 top-4 bg-white/30 hover:bg-white/50 text-white px-4 py-2 rounded-full font-bold transition-colors shadow-sm cursor-pointer z-50 flex items-center gap-2">
            <span>←</span> <span class="hidden sm:inline">Volver</span>
        </button>
        <h1 id="main-title" class="text-2xl sm:text-3xl md:text-4xl font-black tracking-wider drop-shadow-lg flex items-center justify-center gap-3 mt-12 sm:mt-0">
            <span>🚀</span> Portal Educativo <span>📚</span>
        </h1>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-8 w-full z-20 relative">
        
        <!-- DECORATIVE ELEMENTS (Only for Space theme) -->
        <div id="space-decorations" class="hidden absolute inset-0 pointer-events-none overflow-hidden">
            <div class="absolute top-10 left-10 text-4xl opacity-30 animate-float" style="animation-delay: 0s">🚀</div>
            <div class="absolute bottom-20 right-10 text-5xl opacity-30 animate-float" style="animation-delay: 1s">🪐</div>
            <div class="absolute top-1/3 right-20 text-3xl opacity-20 animate-float" style="animation-delay: 2s">☄️</div>
        </div>

        <!-- APP SELECTOR MENU -->
        <div id="view-main-selector" class="view-section active max-w-4xl w-full">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-4">
                
                <!-- Tierra APP Button -->
                <button onclick="showApp('tierra')" class="group relative bg-gradient-to-br from-orange-400 to-red-600 rounded-3xl p-8 border-4 border-white shadow-2xl hover:scale-105 transition-transform overflow-hidden flex flex-col items-center justify-center min-h-[300px]">
                    <div class="absolute top-0 left-0 w-full h-full bg-white opacity-0 group-hover:opacity-10 transition-opacity"></div>
                    <div class="text-8xl mb-4 group-hover:animate-bounce-hover">🌎</div>
                    <h2 class="text-3xl font-black text-white drop-shadow-md text-center">Capas de la Tierra</h2>
                    <p class="text-orange-100 mt-2 font-medium bg-black/20 px-4 py-1 rounded-full">Ciencias Naturales</p>
                </button>

                <!-- Espacio APP Button -->
                <button onclick="showApp('espacio')" class="group relative bg-gradient-to-br from-indigo-800 to-purple-900 rounded-3xl p-8 border-4 border-slate-700 shadow-2xl hover:scale-105 transition-transform overflow-hidden flex flex-col items-center justify-center min-h-[300px] stars-bg">
                    <div class="absolute top-0 left-0 w-full h-full bg-blue-500 opacity-0 group-hover:opacity-20 transition-opacity"></div>
                    <div class="text-8xl mb-4 group-hover:animate-float">👨‍🚀</div>
                    <h2 class="text-3xl font-black text-white drop-shadow-md text-center">Space Mission</h2>
                    <p class="text-indigo-200 mt-2 font-medium bg-black/40 px-4 py-1 rounded-full border border-indigo-500/50">Inglés</p>
                </button>

            </div>
        </div>

        <!-- ==========================================
             APP 1: CAPAS DE LA TIERRA
             ========================================== -->
        
        <!-- Menú Tierra -->
        <div id="view-tierra-menu" class="view-section max-w-2xl w-full mx-auto bg-white p-6 md:p-8 rounded-3xl shadow-xl text-center border-4 border-orange-300">
            <h2 class="text-2xl font-bold text-orange-600 mb-4">Misiones Geológicas 🌋</h2>
            <div class="grid gap-4 md:grid-cols-1">
                <button onclick="startTierraQuiz()" class="group flex items-center justify-between bg-gradient-to-r from-blue-400 to-blue-500 p-4 rounded-2xl text-white shadow-lg hover:scale-105 transition-transform text-left w-full">
                    <div>
                        <h3 class="text-xl font-bold">1. Trivia Geológica 🧠</h3>
                        <p class="text-blue-100 mt-1 text-sm">Responde las preguntas de alternativas.</p>
                    </div>
                    <span class="text-4xl group-hover:animate-bounce-hover">❓</span>
                </button>
                <button onclick="startTierraMatch()" class="group flex items-center justify-between bg-gradient-to-r from-green-400 to-green-500 p-4 rounded-2xl text-white shadow-lg hover:scale-105 transition-transform text-left w-full">
                    <div>
                        <h3 class="text-xl font-bold">2. Conecta las Capas 🧩</h3>
                        <p class="text-green-100 mt-1 text-sm">Une cada concepto con su definición.</p>
                    </div>
                    <span class="text-4xl group-hover:animate-bounce-hover">🔗</span>
                </button>
                <button onclick="startTierraWords()" class="group flex items-center justify-between bg-gradient-to-r from-purple-400 to-purple-500 p-4 rounded-2xl text-white shadow-lg hover:scale-105 transition-transform text-left w-full">
                    <div>
                        <h3 class="text-xl font-bold">3. Palabra Oculta 🕵️‍♀️</h3>
                        <p class="text-purple-100 mt-1 text-sm">Descubre la palabra secreta.</p>
                    </div>
                    <span class="text-4xl group-hover:animate-bounce-hover">🔤</span>
                </button>
                <button onclick="startTierraSort()" class="group flex items-center justify-between bg-gradient-to-r from-yellow-400 to-yellow-500 p-4 rounded-2xl text-white shadow-lg hover:scale-105 transition-transform text-left w-full">
                    <div>
                        <h3 class="text-xl font-bold">4. Ordena las Capas 🌍</h3>
                        <p class="text-yellow-100 mt-1 text-sm">Desde el exterior al interior.</p>
                    </div>
                    <span class="text-4xl group-hover:animate-bounce-hover">⬇️</span>
                </button>
                <button onclick="startTierraTF()" class="group flex items-center justify-between bg-gradient-to-r from-rose-400 to-rose-500 p-4 rounded-2xl text-white shadow-lg hover:scale-105 transition-transform text-left w-full">
                    <div>
                        <h3 class="text-xl font-bold">5. Verdadero o Falso ⚡</h3>
                        <p class="text-rose-100 mt-1 text-sm">Pon a prueba tus reflejos.</p>
                    </div>
                    <span class="text-4xl group-hover:animate-bounce-hover">✅</span>
                </button>
                <button onclick="startTierraImage()" class="group flex items-center justify-between bg-gradient-to-r from-teal-400 to-teal-500 p-4 rounded-2xl text-white shadow-lg hover:scale-105 transition-transform text-left w-full">
                    <div>
                        <h3 class="text-xl font-bold">6. Etiqueta las Capas 🖼️</h3>
                        <p class="text-teal-100 mt-1 text-sm">Completa el esquema visual.</p>
                    </div>
                    <span class="text-4xl group-hover:animate-bounce-hover">🏷️</span>
                </button>
            </div>
        </div>

        <!-- Juegos Tierra -->
        <div id="view-tierra-quiz" class="view-section"></div>
        <div id="view-tierra-match" class="view-section"></div>
        <div id="view-tierra-words" class="view-section"></div>
        <div id="view-tierra-sort" class="view-section"></div>
        <div id="view-tierra-tf" class="view-section"></div>
        <div id="view-tierra-image" class="view-section"></div>

        <!-- ==========================================
             APP 2: SPACE MISSION (INGLÉS)
             ========================================== -->
        
        <!-- Menú Espacio -->
        <div id="view-espacio-menu" class="view-section"></div>

        <!-- Juegos Espacio -->
        <div id="view-espacio-memory" class="view-section hidden"></div>
        <div id="view-espacio-ordinals" class="view-section hidden"></div>
        <div id="view-espacio-gear" class="view-section hidden"></div>
        <div id="view-espacio-planets" class="view-section hidden"></div>
        <div id="view-espacio-routine" class="view-section hidden"></div>

        <!-- Pantalla de Resultados Universal -->
        <div id="view-result" class="view-section"></div>

    </main>

    <!-- SCRIPTS CORE LOGIC -->
    <script>
        // --- 1. MOTOR DE AUDIO ---
        let audioCtx = null;
        const initAudio = () => {
            if (!audioCtx) {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                } catch(e) { console.log("Audio no soportado"); }
            }
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        };

        const playTone = (freq, type, duration, vol=0.1) => {
            if(!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        };

        const sounds = {
            click: () => playTone(800, 'triangle', 0.05, 0.05),
            tierra_correct: () => { playTone(440, 'sine', 0.1, 0.2); setTimeout(() => playTone(659.25, 'sine', 0.3, 0.2), 100); },
            tierra_incorrect: () => { playTone(300, 'sawtooth', 0.2, 0.1); setTimeout(() => playTone(250, 'sawtooth', 0.3, 0.1), 150); },
            tierra_win: () => { playTone(523.25, 'sine', 0.5, 0.15); playTone(659.25, 'sine', 0.5, 0.15); playTone(783.99, 'sine', 0.5, 0.15); setTimeout(() => playTone(1046.50, 'sine', 0.8, 0.2), 300); },
            espacio_correct: () => { playTone(600, 'sine', 0.1, 0.2); setTimeout(() => playTone(1200, 'sine', 0.2, 0.2), 100); },
            espacio_incorrect: () => { playTone(300, 'square', 0.2, 0.1); setTimeout(() => playTone(150, 'square', 0.2, 0.1), 100); },
            espacio_win: () => { playTone(400, 'triangle', 0.1, 0.2); setTimeout(() => playTone(500, 'triangle', 0.1, 0.2), 100); setTimeout(() => playTone(600, 'triangle', 0.1, 0.2), 200); setTimeout(() => playTone(800, 'triangle', 0.3, 0.2), 300); }
        };

        // --- 2. GESTIÓN DE VISTAS (NAVEGACIÓN) ---
        let currentApp = null; // 'tierra' | 'espacio' | null
        let historyStack = ['main-selector'];

        function hideAllViews() {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        }

        function showView(viewId) {
            hideAllViews();
            document.getElementById(`view-${viewId}`).classList.add('active');
            
            const btnBack = document.getElementById('btn-back');
            if (viewId === 'main-selector') {
                btnBack.classList.add('hidden');
                currentApp = null;
                applyAppTheme(null);
                historyStack = ['main-selector'];
            } else {
                btnBack.classList.remove('hidden');
                // Gestionar el historial
                if(historyStack[historyStack.length-1] !== viewId) {
                    historyStack.push(viewId);
                }
            }
        }

        function goBack() {
            initAudio();
            sounds.click();
            if (historyStack.length > 1) {
                historyStack.pop(); // quitar la actual
                const prevView = historyStack[historyStack.length - 1];
                
                // Limpiar intervalos/timeouts si los hubiera al salir a medias
                hideAllViews();
                document.getElementById(`view-${prevView}`).classList.add('active');
                
                if (prevView === 'main-selector') {
                    currentApp = null;
                    applyAppTheme(null);
                    document.getElementById('btn-back').classList.add('hidden');
                } else if (prevView === 'tierra-menu') {
                    applyAppTheme('tierra');
                } else if (prevView === 'espacio-menu') {
                    applyAppTheme('espacio');
                }
            }
        }

        function showApp(appType) {
            initAudio();
            sounds.click();
            currentApp = appType;
            applyAppTheme(appType);
            
            if (appType === 'tierra') {
                showView('tierra-menu');
            } else if (appType === 'espacio') {
                renderEspacioMenu();
                showView('espacio-menu');
            }
        }

        function applyAppTheme(appType) {
            const header = document.getElementById('global-header');
            const title = document.getElementById('main-title');
            const spaceDecor = document.getElementById('space-decorations');
            
            document.body.className = "min-h-screen flex flex-col overflow-x-hidden font-sans";

            if (appType === 'tierra') {
                document.body.classList.add('bg-blue-100', 'selection:bg-orange-300');
                header.className = "p-4 shadow-md text-white text-center relative z-50 transition-colors duration-500 rounded-b-3xl mb-6 bg-gradient-to-r from-orange-400 to-red-500";
                title.innerHTML = `<span>🌎</span> Misión: Capas de la Tierra <span>🌋</span>`;
                spaceDecor.classList.add('hidden');
            } else if (appType === 'espacio') {
                document.body.classList.add('bg-slate-900', 'stars-bg', 'selection:bg-purple-500', 'selection:text-white');
                header.className = "w-full bg-black/40 border-b border-indigo-900/50 p-4 sticky top-0 z-50 backdrop-blur-sm transition-colors duration-500";
                title.innerHTML = `<span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-yellow-400 font-black">👨‍🚀 SPACE MISSION ACADEMY 👩‍🚀</span>`;
                spaceDecor.classList.remove('hidden');
            } else {
                document.body.classList.add('bg-slate-100');
                header.className = "p-4 shadow-md text-white text-center relative z-50 transition-colors duration-500 bg-gradient-to-r from-indigo-600 to-purple-700";
                title.innerHTML = `<span>🚀</span> Portal Educativo <span>📚</span>`;
                spaceDecor.classList.add('hidden');
            }
        }

        // --- PANTALLA RESULTADOS COMÚN ---
        function showResultScreen(score, total, title, originId, appType) {
            const container = document.getElementById('view-result');
            const isPerfect = score === total;
            const theme = appType === 'tierra' 
                ? { bg: 'bg-white', border: 'border-yellow-400', titleCol: 'text-gray-800', pCol: 'text-gray-600', boxBg: 'bg-yellow-100 border-yellow-300', boxTxt: 'text-yellow-800', scoreCol: 'text-yellow-600', msg: '¡Felicidades! Eres experta en geología.', btn: 'bg-gradient-to-r from-orange-400 to-red-500' }
                : { bg: 'bg-indigo-900/80 backdrop-blur-md', border: 'border-cyan-400', titleCol: 'text-white', pCol: 'text-indigo-200', boxBg: 'bg-black/40 border-cyan-500', boxTxt: 'text-cyan-300', scoreCol: 'text-yellow-300', msg: '¡Misión Cumplida Cadete!', btn: 'bg-cyan-500 hover:bg-cyan-400' };

            let restartAction = "";
            if(originId === 'tierra-quiz') restartAction = "startTierraQuiz()";
            if(originId === 'tierra-match') restartAction = "startTierraMatch()";
            if(originId === 'tierra-words') restartAction = "startTierraWords()";
            if(originId === 'tierra-sort') restartAction = "startTierraSort()";
            if(originId === 'tierra-tf') restartAction = "startTierraTF()";
            if(originId === 'tierra-image') restartAction = "startTierraImage()";
            if(originId === 'espacio-memory') restartAction = "startSpaceMemory()";
            if(originId === 'espacio-ordinals') restartAction = "startSpaceOrdinals()";
            if(originId === 'espacio-gear') restartAction = "startSpaceGear()";
            if(originId === 'espacio-planets') restartAction = "startSpacePlanets()";
            if(originId === 'espacio-routine') restartAction = "startSpaceRoutine()";

            let html = `
                <div class="max-w-lg w-full mx-auto p-10 rounded-3xl shadow-2xl text-center border-4 animate-fade-in-up ${theme.bg} ${theme.border}">
                    <div class="text-6xl mb-4 animate-bounce">${isPerfect ? '🏆' : '🌟'}</div>
                    <h2 class="text-3xl font-extrabold mb-2 ${theme.titleCol}">${appType === 'tierra' ? '¡Misión Completada!' : 'Mission Accomplished!'}</h2>
                    <p class="text-lg mb-6 ${theme.pCol}">${appType === 'tierra' ? 'Juego terminado:' : 'Module complete:'} <span class="font-bold">${title}</span></p>
                    
                    <div class="rounded-2xl p-6 mb-8 border-2 ${theme.boxBg}">
                        <p class="text-xl font-medium ${theme.boxTxt}">${appType === 'tierra' ? 'Tu puntaje es:' : 'Final Score:'}</p>
                        <p class="text-5xl font-black mt-2 ${theme.scoreCol}">${score} / ${total}</p>
                    </div>
                    
                    <p class="text-xl font-bold mb-8 ${isPerfect ? 'text-green-500' : 'text-blue-400'}">${theme.msg}</p>

                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <button onclick="${restartAction}" class="px-6 py-3 rounded-full font-bold text-lg shadow-lg hover:scale-105 transition-transform text-white ${theme.btn}">
                            ${appType === 'tierra' ? 'Reintentar 🔄' : 'Try Again 🔄'}
                        </button>
                        <button onclick="goBack()" class="px-6 py-3 rounded-full font-bold text-lg shadow-lg hover:scale-105 transition-transform bg-slate-600 text-white hover:bg-slate-500">
                            ${appType === 'tierra' ? 'Ir al Menú 🏠' : 'Return to Base 🏠'}
                        </button>
                    </div>
                </div>
            `;
            container.innerHTML = html;
            showView('result');
        }

        // ==========================================
        // APP 1 DATA & LOGIC: CAPAS DE LA TIERRA
        // ==========================================
        const tierraData = [
            { term: "Corteza", def: "Es la capa más externa, delgada y superficial de la Tierra.", options: ["Corteza", "Manto", "Núcleo Interno", "Suelo"] },
            { term: "Placas", def: "Grandes fragmentos de litósfera que se mueven sobre el manto.", options: ["Continentes", "Océanos", "Placas", "Rocas"] },
            { term: "Manto", def: "Capa intermedia, la más gruesa de la Tierra. Tiene un comportamiento plástico.", options: ["Manto", "Litosfera", "Corteza", "Núcleo Externo"] },
            { term: "Suelo", def: "Capa superior de la Tierra que sustenta la vida vegetal y animal.", options: ["Litosfera", "Suelo", "Corteza", "Placas"] },
            { term: "Núcleo Externo", def: "Capa de hierro y níquel en estado líquido, situada entre el manto y el núcleo interno.", options: ["Manto Inferior", "Núcleo Interno", "Núcleo Externo", "Litosfera"] },
            { term: "Litosfera", def: "Parte superior de la Tierra, compuesta por la corteza y parte del manto superior. Es la capa más rígida.", options: ["Litosfera", "Manto", "Núcleo Interno", "Corteza"] },
            { term: "Núcleo Interno", def: "Capa que se encuentra en el centro de la Tierra. Es la parte más profunda y está en estado sólido.", options: ["Núcleo Externo", "Manto", "Núcleo Interno", "Suelo"] },
            { term: "Líquido", def: "Corresponde al estado de la materia en el que se encuentra el Núcleo Externo.", options: ["Sólido", "Gaseoso", "Líquido", "Plasmático"] },
            { term: "Hierro", def: "Principal elemento por el cual se conforma el Núcleo Interno (hasta un 70%).", options: ["Cobre", "Níquel", "Hierro", "Oro"] }
        ];

        // --- Tierra: Trivia ---
        let tQuizState = { currentQ: 0, score: 0, options: [], answered: false };
        
        function startTierraQuiz() {
            tQuizState = { currentQ: 0, score: 0, options: [], answered: false };
            showView('tierra-quiz');
            renderTierraQuiz();
        }

        function renderTierraQuiz() {
            const container = document.getElementById('view-tierra-quiz');
            if (tQuizState.currentQ >= tierraData.length) {
                showResultScreen(tQuizState.score, tierraData.length, "Trivia Geológica", 'tierra-quiz', 'tierra');
                return;
            }

            const currentData = tierraData[tQuizState.currentQ];
            if (tQuizState.options.length === 0) {
                tQuizState.options = [...currentData.options].sort(() => Math.random() - 0.5);
            }

            let html = `
                <div class="max-w-2xl mx-auto bg-white p-6 md:p-8 rounded-3xl shadow-xl border-4 border-blue-300 text-center animate-fade-in-up w-full">
                    <div class="flex justify-between items-center mb-6 text-blue-500 font-bold">
                        <span>Pregunta ${tQuizState.currentQ + 1} de ${tierraData.length}</span>
                        <span>Puntos: ${tQuizState.score} ⭐</span>
                    </div>
                    <div class="bg-blue-50 p-6 rounded-2xl mb-8 min-h-[120px] flex items-center justify-center border-2 border-blue-200">
                        <h3 class="text-xl md:text-2xl font-semibold text-gray-700">"${currentData.def}"</h3>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="tierra-quiz-options">
            `;

            tQuizState.options.forEach(opt => {
                let btnClass = "bg-gray-100 hover:bg-blue-100 text-gray-700 border-2 border-gray-200";
                html += `<button onclick="handleTierraQuizAns('${opt}')" class="p-4 rounded-xl text-lg font-bold transition-all transform active:scale-95 ${btnClass} quiz-btn">${opt}</button>`;
            });

            html += `</div><div id="tierra-quiz-feedback" class="mt-6 text-2xl font-bold h-8"></div></div>`;
            container.innerHTML = html;
        }

        function handleTierraQuizAns(selected) {
            if (tQuizState.answered) return;
            tQuizState.answered = true;
            initAudio();

            const currentData = tierraData[tQuizState.currentQ];
            const isCorrect = selected === currentData.term;
            const btns = document.querySelectorAll('.quiz-btn');
            const feedback = document.getElementById('tierra-quiz-feedback');

            if (isCorrect) {
                sounds.tierra_correct();
                tQuizState.score++;
                feedback.innerHTML = `<span class="text-green-500 animate-bounce block">¡Correcto! 🎉</span>`;
            } else {
                sounds.tierra_incorrect();
                feedback.innerHTML = `<span class="text-red-500 animate-bounce block">¡Casi! Era ${currentData.term} 😅</span>`;
            }

            btns.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === currentData.term) {
                    btn.className = "quiz-btn p-4 rounded-xl text-lg font-bold transition-all bg-green-500 text-white border-2 border-green-600 animate-pulse";
                } else if (btn.innerText === selected && !isCorrect) {
                    btn.className = "quiz-btn p-4 rounded-xl text-lg font-bold transition-all bg-red-200 text-red-800 border-2 border-red-300 opacity-50";
                } else {
                    btn.className = "quiz-btn p-4 rounded-xl text-lg font-bold transition-all bg-gray-100 text-gray-400 border-2 border-gray-200 opacity-50";
                }
            });

            setTimeout(() => {
                tQuizState.currentQ++;
                tQuizState.options = [];
                tQuizState.answered = false;
                if(tQuizState.currentQ >= tierraData.length) sounds.tierra_win();
                renderTierraQuiz();
            }, 1500);
        }

        // --- Tierra: Match ---
        let tMatchState = { terms: [], defs: [], selTerm: null, selDef: null, matched: [] };
        function startTierraMatch() {
            const shuffled = [...tierraData].sort(() => 0.5 - Math.random()).slice(0, 5);
            tMatchState = {
                terms: shuffled.map(d => d.term).sort(() => 0.5 - Math.random()),
                defs: shuffled.map(d => ({ term: d.term, text: d.def })).sort(() => 0.5 - Math.random()),
                selTerm: null, selDef: null, matched: []
            };
            showView('tierra-match');
            renderTierraMatch();
        }

        function renderTierraMatch() {
            const container = document.getElementById('view-tierra-match');
            if (tMatchState.matched.length === tMatchState.terms.length) {
                sounds.tierra_win();
                showResultScreen(5, 5, "Conecta las Capas", 'tierra-match', 'tierra');
                return;
            }

            let html = `<div class="max-w-4xl mx-auto bg-white p-6 md:p-8 rounded-3xl shadow-xl border-4 border-green-300 w-full animate-fade-in-up"><h2 class="text-2xl font-bold text-center text-green-600 mb-6">Toca un concepto y luego su definición</h2><div class="flex flex-col md:flex-row gap-6"><div class="flex-1 flex flex-col gap-3"><h3 class="font-bold text-gray-500 text-center uppercase tracking-wide">Conceptos</h3>`;
            
            tMatchState.terms.forEach(t => {
                const isMatched = tMatchState.matched.includes(t);
                const isSelected = tMatchState.selTerm === t;
                let styles = "bg-orange-100 border-orange-300 text-orange-800 hover:bg-orange-200";
                if (isMatched) styles = "bg-green-500 border-green-600 text-white opacity-50 cursor-not-allowed";
                else if (isSelected) styles = "bg-orange-400 border-orange-500 text-white scale-105 shadow-md";
                html += `<button ${isMatched?'disabled':''} onclick="selTMatchTerm('${t}')" class="p-4 rounded-xl border-2 font-bold transition-all text-left md:text-center ${styles}">${t}</button>`;
            });

            html += `</div><div class="flex-1 flex flex-col gap-3"><h3 class="font-bold text-gray-500 text-center uppercase tracking-wide">Definiciones</h3>`;
            
            tMatchState.defs.forEach((d, i) => {
                const isMatched = tMatchState.matched.includes(d.term);
                const isSelected = tMatchState.selDef && tMatchState.selDef.text === d.text;
                let styles = "bg-blue-50 border-blue-200 text-gray-700 hover:bg-blue-100";
                if (isMatched) styles = "bg-green-500 border-green-600 text-white opacity-50 cursor-not-allowed";
                else if (isSelected) styles = "bg-blue-300 border-blue-400 text-blue-900 scale-105 shadow-md";
                html += `<button ${isMatched?'disabled':''} onclick="selTMatchDef(${i})" class="p-4 rounded-xl border-2 text-sm md:text-base font-medium transition-all text-left ${styles}">${d.text}</button>`;
            });
            html += `</div></div></div>`;
            container.innerHTML = html;
            checkTMatch();
        }

        function selTMatchTerm(t) { initAudio(); sounds.click(); tMatchState.selTerm = t; renderTierraMatch(); }
        function selTMatchDef(i) { initAudio(); sounds.click(); tMatchState.selDef = tMatchState.defs[i]; renderTierraMatch(); }
        function checkTMatch() {
            if (tMatchState.selTerm && tMatchState.selDef) {
                if (tMatchState.selTerm === tMatchState.selDef.term) {
                    sounds.tierra_correct();
                    tMatchState.matched.push(tMatchState.selTerm);
                    tMatchState.selTerm = null; tMatchState.selDef = null;
                    setTimeout(renderTierraMatch, 300);
                } else {
                    sounds.tierra_incorrect();
                    setTimeout(() => { tMatchState.selTerm = null; tMatchState.selDef = null; renderTierraMatch(); }, 800);
                }
            }
        }

        // --- Tierra: Words ---
        let tWordsData = [];
        let tWordsState = { currentIdx: 0, guessed: [], score: 0 };
        function startTierraWords() {
            tWordsData = tierraData.filter(d => !d.term.includes(" ")).map(d => ({
                word: d.term.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""),
                clue: d.def
            }));
            tWordsState = { currentIdx: 0, guessed: [], score: 0 };
            showView('tierra-words');
            renderTierraWords();
        }

        function renderTierraWords() {
            const container = document.getElementById('view-tierra-words');
            if (tWordsState.currentIdx >= tWordsData.length) {
                showResultScreen(tWordsState.score, tWordsData.length, "Palabra Oculta", 'tierra-words', 'tierra');
                return;
            }

            const currentData = tWordsData[tWordsState.currentIdx];
            const wordLetters = currentData.word.split('');
            const isWordGuessed = wordLetters.every(l => tWordsState.guessed.includes(l));

            let html = `<div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-3xl shadow-xl border-4 border-purple-300 text-center w-full animate-fade-in-up">
                <div class="flex justify-between items-center mb-4 text-purple-500 font-bold"><span>Palabra ${tWordsState.currentIdx + 1} de ${tWordsData.length}</span><span>Puntos: ${tWordsState.score} ⭐</span></div>
                <div class="bg-purple-100 p-4 rounded-xl mb-8 border-2 border-purple-200"><p class="text-purple-800 font-medium text-lg">Pista: ${currentData.clue}</p></div>
                <div class="flex flex-wrap justify-center gap-2 mb-10">`;

            wordLetters.forEach(l => {
                const show = tWordsState.guessed.includes(l);
                html += `<div class="w-12 h-14 md:w-16 md:h-20 bg-gray-100 border-b-4 border-purple-600 rounded-md flex items-center justify-center text-2xl md:text-4xl font-extrabold text-purple-800 shadow-inner">${show ? l : ''}</div>`;
            });
            html += `</div>`;

            if (isWordGuessed) {
                html += `<div class="text-2xl font-bold text-green-500 animate-bounce mb-6">¡Excelente! 🎉</div>`;
                if(!tWordsState.winTriggered) {
                    tWordsState.winTriggered = true;
                    sounds.tierra_correct();
                    setTimeout(() => {
                        tWordsState.score++; tWordsState.currentIdx++; tWordsState.guessed = []; tWordsState.winTriggered = false;
                        if(tWordsState.currentIdx >= tWordsData.length) sounds.tierra_win();
                        renderTierraWords();
                    }, 1500);
                }
            }

            const alphabet = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split('');
            html += `<div class="flex flex-wrap justify-center gap-2 max-w-xl mx-auto">`;
            alphabet.forEach(l => {
                const isGuessed = tWordsState.guessed.includes(l);
                const isCorrect = isGuessed && wordLetters.includes(l);
                const isWrong = isGuessed && !wordLetters.includes(l);
                let btnColor = "bg-white border-gray-300 text-gray-700 hover:bg-purple-50";
                if (isCorrect) btnColor = "bg-green-500 border-green-600 text-white";
                if (isWrong) btnColor = "bg-gray-300 border-gray-400 text-gray-500 opacity-50";
                html += `<button ${isGuessed || isWordGuessed ? 'disabled' : ''} onclick="guessTWord('${l}')" class="w-10 h-12 md:w-12 md:h-14 rounded-lg border-b-4 font-bold text-lg md:text-xl transition-colors ${btnColor}">${l}</button>`;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        function guessTWord(l) {
            initAudio(); sounds.click();
            const currentData = tWordsData[tWordsState.currentIdx];
            if (!currentData.word.includes(l)) sounds.tierra_incorrect();
            tWordsState.guessed.push(l);
            renderTierraWords();
        }

        // --- Tierra: Ordena las Capas ---
        const correctTierraLayers = ["Corteza", "Manto", "Núcleo Externo", "Núcleo Interno"];
        const layerEmojis = {"Corteza": "🪨", "Manto": "🌋", "Núcleo Externo": "🌊", "Núcleo Interno": "🔥"};
        let tSortState = { currentItems: [], isChecked: false, isCorrect: false };
        
        function startTierraSort() {
            tSortState.currentItems = [...correctTierraLayers].sort(() => Math.random() - 0.5);
            tSortState.isChecked = false; tSortState.isCorrect = false;
            showView('tierra-sort'); renderTierraSort();
        }
        
        function renderTierraSort() {
            const container = document.getElementById('view-tierra-sort');
            let html = `<div class="max-w-xl mx-auto bg-white p-6 md:p-8 rounded-3xl shadow-xl border-4 border-yellow-400 text-center animate-fade-in-up w-full">
                <h2 class="text-xl md:text-3xl font-black text-yellow-600 mb-2 drop-shadow-sm">4. Ordena las Capas</h2>
                <p class="text-slate-600 mb-6 font-medium">Ordena desde el exterior (arriba) hasta el centro de la Tierra (abajo).</p>
                <div class="flex flex-col gap-3 mb-8 px-4 relative">
                    <div class="absolute -left-2 top-0 bottom-0 w-2 bg-gradient-to-b from-green-400 via-orange-400 to-red-600 rounded-full"></div>
                    <div class="absolute -left-7 top-0 text-3xl animate-bounce">🌱</div>
                    <div class="absolute -left-7 bottom-0 text-3xl animate-pulse">🔥</div>`;
            
            tSortState.currentItems.forEach((item, index) => {
                html += `<div class="flex items-center justify-between p-3 rounded-xl border-2 border-slate-200 bg-slate-50 shadow-sm transition-transform"><div class="flex items-center gap-3"><span class="font-black text-slate-400 text-lg w-6">${index + 1}.</span><span class="text-2xl">${layerEmojis[item]}</span><span class="font-bold text-lg text-slate-700">${item}</span></div><div class="flex gap-2"><button onclick="moveTierraSort(${index}, -1)" ${index === 0 || tSortState.isChecked ? 'disabled' : ''} class="w-10 h-10 bg-slate-200 hover:bg-yellow-400 text-slate-700 hover:text-white rounded-lg flex items-center justify-center font-black text-xl disabled:opacity-30 disabled:hover:bg-slate-200 disabled:hover:text-slate-700 transition-colors shadow-sm">↑</button><button onclick="moveTierraSort(${index}, 1)" ${index === tSortState.currentItems.length - 1 || tSortState.isChecked ? 'disabled' : ''} class="w-10 h-10 bg-slate-200 hover:bg-yellow-400 text-slate-700 hover:text-white rounded-lg flex items-center justify-center font-black text-xl disabled:opacity-30 disabled:hover:bg-slate-200 disabled:hover:text-slate-700 transition-colors shadow-sm">↓</button></div></div>`;
            });
            html += `</div>`;
            if (tSortState.isChecked) {
                if (tSortState.isCorrect) { 
                    html += `<div class="text-2xl font-black text-green-500 animate-bounce mb-6 drop-shadow-md">¡Excelente trabajo! 🌍</div>`; 
                    if(!tSortState.winTriggered){ tSortState.winTriggered = true; setTimeout(() => { tSortState.winTriggered = false; showResultScreen(1, 1, "Ordena las Capas", 'tierra-sort', 'tierra'); }, 1500); }
                } 
                else { html += `<div class="text-xl font-bold text-red-500 mb-6 drop-shadow-md">Ese no es el orden correcto. ¡Intenta de nuevo!</div><button onclick="startTierraSort()" class="bg-gradient-to-r from-yellow-400 to-orange-500 text-white px-8 py-3 rounded-full font-black shadow-lg hover:scale-105 transition-transform">Reintentar</button>`; }
            } else { html += `<button onclick="checkTierraSort()" class="bg-gradient-to-r from-yellow-400 to-orange-500 text-white px-8 py-3 rounded-full font-black text-xl shadow-md hover:shadow-lg hover:-translate-y-1 transition-all w-full md:w-auto">Comprobar Orden</button>`; }
            html += `</div>`; container.innerHTML = html;
        }
        
        function moveTierraSort(index, direction) { initAudio(); sounds.click(); const newIndex = index + direction; if (newIndex < 0 || newIndex >= tSortState.currentItems.length) return; const items = [...tSortState.currentItems]; [items[index], items[newIndex]] = [items[newIndex], items[index]]; tSortState.currentItems = items; renderTierraSort(); }
        function checkTierraSort() { initAudio(); tSortState.isChecked = true; tSortState.isCorrect = JSON.stringify(tSortState.currentItems) === JSON.stringify(correctTierraLayers); if (tSortState.isCorrect) sounds.tierra_win(); else sounds.tierra_incorrect(); renderTierraSort(); }

        // --- Tierra: Verdadero o Falso ---
        const tTFData = [
            { q: "La corteza es la capa más gruesa de la Tierra.", ans: false },
            { q: "El manto tiene un comportamiento plástico.", ans: true },
            { q: "El núcleo externo está en estado líquido.", ans: true },
            { q: "La litosfera es la capa más rígida.", ans: true },
            { q: "El núcleo interno está hecho de agua y sal.", ans: false },
            { q: "Las placas tectónicas se mueven sobre el manto.", ans: true },
            { q: "El núcleo externo está en el centro mismo de la Tierra.", ans: false }
        ];
        let tTFState = { currentQ: 0, score: 0, answered: false, selected: null };

        function startTierraTF() {
            tTFState = { currentQ: 0, score: 0, answered: false, selected: null };
            tTFData.sort(() => Math.random() - 0.5); // Barajar preguntas
            showView('tierra-tf'); renderTierraTF();
        }

        function renderTierraTF() {
            const container = document.getElementById('view-tierra-tf');
            if (tTFState.currentQ >= 5) { // Jugar solo 5 rondas para hacerlo rápido
                showResultScreen(tTFState.score, 5, "Verdadero o Falso", 'tierra-tf', 'tierra');
                return;
            }

            const currentData = tTFData[tTFState.currentQ];
            
            let html = `
                <div class="max-w-2xl mx-auto bg-white p-6 md:p-8 rounded-3xl shadow-xl border-4 border-rose-300 text-center animate-fade-in-up w-full">
                    <div class="flex justify-between items-center mb-6 text-rose-500 font-bold">
                        <span>Pregunta ${tTFState.currentQ + 1} de 5</span>
                        <span>Puntos: ${tTFState.score} ⭐</span>
                    </div>
                    
                    <div class="text-6xl mb-4 animate-bounce-hover">🤔</div>
                    
                    <div class="bg-rose-50 p-6 rounded-2xl mb-8 min-h-[140px] flex items-center justify-center border-2 border-rose-200">
                        <h3 class="text-xl md:text-3xl font-bold text-slate-800 leading-tight">"${currentData.q}"</h3>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            `;

            let btnVClass = "bg-green-100 hover:bg-green-200 text-green-700 border-green-300";
            let btnFClass = "bg-red-100 hover:bg-red-200 text-red-700 border-red-300";

            if (tTFState.answered) {
                if (currentData.ans === true) btnVClass = "bg-green-500 text-white border-green-600 shadow-lg scale-105";
                else if (tTFState.selected === true) btnVClass = "bg-red-500 text-white border-red-600 opacity-50";
                else btnVClass = "bg-gray-100 text-gray-400 border-gray-200 opacity-50";

                if (currentData.ans === false) btnFClass = "bg-green-500 text-white border-green-600 shadow-lg scale-105";
                else if (tTFState.selected === false) btnFClass = "bg-red-500 text-white border-red-600 opacity-50";
                else btnFClass = "bg-gray-100 text-gray-400 border-gray-200 opacity-50";
            }

            html += `<button ${tTFState.answered ? 'disabled' : ''} onclick="handleTierraTF(true)" class="p-6 rounded-2xl text-2xl font-black transition-all transform border-4 flex items-center justify-center gap-3 ${btnVClass}"><span class="text-3xl">✅</span> VERDADERO</button>`;
            html += `<button ${tTFState.answered ? 'disabled' : ''} onclick="handleTierraTF(false)" class="p-6 rounded-2xl text-2xl font-black transition-all transform border-4 flex items-center justify-center gap-3 ${btnFClass}"><span class="text-3xl">❌</span> FALSO</button>`;

            html += `</div></div>`;
            container.innerHTML = html;
        }

        function handleTierraTF(ans) {
            if (tTFState.answered) return;
            initAudio();
            tTFState.answered = true;
            tTFState.selected = ans;

            const isCorrect = ans === tTFData[tTFState.currentQ].ans;
            if (isCorrect) {
                sounds.tierra_correct();
                tTFState.score++;
            } else {
                sounds.tierra_incorrect();
            }

            renderTierraTF();

            setTimeout(() => {
                tTFState.currentQ++;
                tTFState.answered = false;
                tTFState.selected = null;
                if(tTFState.currentQ >= 5) sounds.tierra_win();
                renderTierraTF();
            }, 1500);
        }

        // --- Tierra: Imagen Interactiva (Etiqueta las Capas) ---
        const tImgCorrect = {
            slot1: "Corteza",
            slot2: "Manto",
            slot3: "Núcleo externo",
            slot4: "Núcleo interno"
        };
        let tImgState = {
            selectedTag: null,
            placed: { slot1: null, slot2: null, slot3: null, slot4: null },
            available: [],
            isChecked: false,
            isCorrect: false
        };

        function startTierraImage() {
            tImgState = {
                selectedTag: null,
                placed: { slot1: null, slot2: null, slot3: null, slot4: null },
                available: ["Manto", "Corteza", "Núcleo interno", "Núcleo externo"].sort(() => Math.random() - 0.5),
                isChecked: false,
                isCorrect: false
            };
            showView('tierra-image');
            renderTierraImage();
        }

        function renderTierraImage() {
            const container = document.getElementById('view-tierra-image');
            let html = `
                <div class="max-w-3xl mx-auto bg-white p-4 md:p-8 rounded-3xl shadow-xl border-4 border-teal-300 text-center animate-fade-in-up w-full">
                    <h2 class="text-2xl font-black text-teal-600 mb-2 drop-shadow-sm">6. Etiqueta la Estructura</h2>
                    <p class="text-slate-500 mb-6 font-medium text-sm sm:text-base">Toca un nombre abajo y luego toca el número donde corresponde en el dibujo.</p>

                    <!-- CONTENEDOR DIBUJO SVG -->
                    <div class="relative w-full max-w-sm mx-auto mb-8">
                        <svg viewBox="0 0 420 400" class="w-full h-auto drop-shadow-xl">

                            <circle cx="200" cy="200" r="195" fill="#f0f9ff" opacity="0.6"/>
                            
                            <!-- MITAD IZQUIERDA (Globo Terráqueo) -->
                            <!-- Océanos -->
                            <path d="M 200,40 A 160,160 0 0,0 200,360 Z" fill="#3b82f6" />

                            <path d="M 180,60 Q 130,70 110,120 Q 150,150 180,120 Z" fill="#22c55e" />
                            <path d="M 190,180 Q 130,200 120,280 Q 170,340 195,310 Z" fill="#22c55e" />
                            <path d="M 90,170 Q 40,190 55,260 Q 100,240 115,190 Z" fill="#22c55e" />

                            <!-- MITAD DERECHA (Corte transversal - Capas) -->
                            <!-- 1. Corteza -->
                            <path d="M 200,40 A 160,160 0 0,1 200,360 Z" fill="#8b4513" />

                            <path d="M 200,50 A 150,150 0 0,1 200,350 Z" fill="#ea580c" />

                            <path d="M 200,110 A 90,90 0 0,1 200,290 Z" fill="#f97316" />
                            <!-- 4. Núcleo Interno -->
                            <path d="M 200,155 A 45,45 0 0,1 200,245 Z" fill="#facc15" />

                            <!-- LINEAS Y NUMEROS -->
                            <!-- Línea 1 (Corteza) -->
                            <polyline points="295,95 340,50 375,50" stroke="#334155" stroke-width="3" fill="none" />
                            <circle cx="375" cy="50" r="16" fill="#14b8a6" stroke="#fff" stroke-width="2" />
                            <text x="375" y="56" font-size="16" fill="white" font-family="sans-serif" font-weight="bold" text-anchor="middle">1</text>

                            <!-- Línea 2 (Manto) -->
                            <polyline points="315,160 350,130 375,130" stroke="#334155" stroke-width="3" fill="none" />
                            <circle cx="375" cy="130" r="16" fill="#14b8a6" stroke="#fff" stroke-width="2" />
                            <text x="375" y="136" font-size="16" fill="white" font-family="sans-serif" font-weight="bold" text-anchor="middle">2</text>

                            <!-- Línea 3 (Núcleo Ext) -->
                            <polyline points="265,225 310,230 375,230" stroke="#334155" stroke-width="3" fill="none" />
                            <circle cx="375" cy="230" r="16" fill="#14b8a6" stroke="#fff" stroke-width="2" />
                            <text x="375" y="236" font-size="16" fill="white" font-family="sans-serif" font-weight="bold" text-anchor="middle">3</text>

                            <!-- Línea 4 (Núcleo Int) -->
                            <polyline points="215,225 260,300 375,300" stroke="#334155" stroke-width="3" fill="none" />
                            <circle cx="375" cy="300" r="16" fill="#14b8a6" stroke="#fff" stroke-width="2" />
                            <text x="375" y="306" font-size="16" fill="white" font-family="sans-serif" font-weight="bold" text-anchor="middle">4</text>
                        </svg>
                    </div>

                    <!-- CAJAS DE DESTINO -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
            `;

            [1, 2, 3, 4].forEach(num => {
                const slotKey = 'slot' + num;
                const placedTag = tImgState.placed[slotKey];
                const bgClass = placedTag ? 'bg-teal-50 border-teal-500 shadow-inner' : 'bg-slate-50 border-slate-300 hover:bg-slate-100';
                
                html += `
                    <button onclick="placeTImgSlot('${slotKey}')" class="p-3 border-2 border-dashed rounded-xl flex items-center justify-start gap-3 transition-colors ${bgClass}">
                        <span class="w-8 h-8 rounded-full bg-teal-500 text-white font-bold flex items-center justify-center shrink-0 shadow-sm">${num}</span>
                        <span class="font-bold ${placedTag ? 'text-teal-700' : 'text-slate-400'} text-sm sm:text-lg flex-grow text-left">${placedTag || 'Toca para colocar aquí...'}</span>
                        ${placedTag ? '<span class="text-xs text-red-400 hover:text-red-600">✖</span>' : ''}
                    </button>
                `;
            });

            html += `</div>
                    <!-- ETIQUETAS DISPONIBLES -->
                    <div class="bg-slate-100 p-4 rounded-2xl min-h-[80px] flex flex-wrap justify-center items-center gap-3 border-2 border-slate-200">
            `;
            
            if (tImgState.available.length === 0) {
                html += `<span class="text-slate-400 font-medium italic">¡Todas las etiquetas están en su lugar!</span>`;
            } else {
                tImgState.available.forEach(tag => {
                    const isSelected = tImgState.selectedTag === tag;
                    const styleClass = isSelected ? 'bg-orange-500 text-white border-orange-600 scale-110 shadow-lg' : 'bg-white text-slate-700 border-slate-300 hover:bg-orange-50 hover:border-orange-300 shadow-sm';
                    html += `<button onclick="selectTImgTag('${tag}')" class="px-5 py-2 border-2 rounded-full font-bold text-sm sm:text-base transition-all transform ${styleClass}">${tag}</button>`;
                });
            }

            html += `</div>`;

        }
        
        function moveSpacePlanet(index, direction) { initAudio(); sounds.click(); const newIndex = index + direction; if (newIndex < 0 || newIndex >= planetsState.currentItems.length) return; const items = [...planetsState.currentItems]; [items[index], items[newIndex]] = [items[newIndex], items[index]]; planetsState.currentItems = items; renderSpacePlanets(); }
        function checkSpacePlanets() { initAudio(); planetsState.isChecked = true; planetsState.isCorrect = JSON.stringify(planetsState.currentItems) === JSON.stringify(correctPlanets); if (planetsState.isCorrect) sounds.espacio_win(); else sounds.espacio_incorrect(); renderSpacePlanets(); }

        // --- Espacio: Daily Routine ---
        const correctRoutine = ["I wake up", "I have breakfast", "I go to school", "I have lunch", "I do my homework", "I go to bed"];
        const routineEmojis = {"I wake up": "🥱", "I have breakfast": "🥞", "I go to school": "🎒", "I have lunch": "🍲", "I do my homework": "📚", "I go to bed": "🛌"};
        let routineState = { currentItems: [], isChecked: false, isCorrect: false };
        
        function startSpaceRoutine() {
            routineState.currentItems = [...correctRoutine].sort(() => Math.random() - 0.5);
            routineState.isChecked = false; routineState.isCorrect = false;
            showView('espacio-routine'); renderSpaceRoutine();
        }
        
        function renderSpaceRoutine() {
            const container = document.getElementById('view-espacio-routine');
            let html = `<div class="max-w-xl mx-auto bg-slate-800/90 backdrop-blur-sm p-6 md:p-8 rounded-3xl shadow-[0_0_30px_rgba(219,39,119,0.2)] border-2 border-pink-500 text-center animate-fade-in-up w-full">
                <h2 class="text-xl md:text-3xl font-black text-pink-400 mb-2 drop-shadow-md">Misión 5: Daily Routine</h2>
                <p class="text-slate-300 mb-6 font-medium">Ordena las actividades desde la mañana hasta la noche.</p>
                <div class="flex flex-col gap-3 mb-8 px-4 relative">
                    <div class="absolute -left-2 top-0 bottom-0 w-2 bg-gradient-to-b from-yellow-300 via-pink-500 to-indigo-900 rounded-full shadow-[0_0_10px_rgba(236,72,153,0.5)]"></div>
                    <div class="absolute -left-7 top-0 text-3xl animate-bounce">🌅</div>
                    <div class="absolute -left-7 bottom-0 text-3xl animate-pulse">🌙</div>`;
            
            routineState.currentItems.forEach((item, index) => {
                html += `<div class="flex items-center justify-between p-3 rounded-xl border-2 border-slate-600 bg-slate-700 shadow-md transition-transform"><div class="flex items-center gap-3"><span class="font-black text-slate-400 text-lg w-6">${index + 1}.</span><span class="text-2xl">${routineEmojis[item]}</span><span class="font-bold text-lg text-white">${item}</span></div><div class="flex gap-2"><button onclick="moveSpaceRoutine(${index}, -1)" ${index === 0 || routineState.isChecked ? 'disabled' : ''} class="w-10 h-10 bg-slate-600 hover:bg-pink-500 text-white rounded-lg flex items-center justify-center font-black text-xl disabled:opacity-30 disabled:hover:bg-slate-600 transition-colors shadow-sm">↑</button><button onclick="moveSpaceRoutine(${index}, 1)" ${index === routineState.currentItems.length - 1 || routineState.isChecked ? 'disabled' : ''} class="w-10 h-10 bg-slate-600 hover:bg-pink-500 text-white rounded-lg flex items-center justify-center font-black text-xl disabled:opacity-30 disabled:hover:bg-slate-600 transition-colors shadow-sm">↓</button></div></div>`;
            });
            html += `</div>`;
            if (routineState.isChecked) {
                if (routineState.isCorrect) { html += `<div class="text-2xl font-black text-green-400 animate-bounce mb-6 drop-shadow-md">¡Rutina Perfecta! 🏆</div>`; setTimeout(() => showResultScreen(1, 1, "Daily Routine", 'espacio-routine', 'espacio'), 1500); } 
                else { html += `<div class="text-xl font-bold text-red-400 mb-6 drop-shadow-md">Algo está fuera de orden. ¡Verifica el reloj!</div><button onclick="startSpaceRoutine()" class="bg-gradient-to-r from-pink-500 to-purple-600 text-white px-8 py-3 rounded-full font-black shadow-lg hover:scale-105 transition-transform">Reintentar</button>`; }
            } else { html += `<button onclick="checkSpaceRoutine()" class="bg-gradient-to-r from-pink-500 to-purple-600 text-white px-8 py-3 rounded-full font-black text-xl shadow-[0_0_20px_rgba(236,72,153,0.4)] hover:shadow-[0_0_30px_rgba(236,72,153,0.6)] hover:-translate-y-1 transition-all w-full md:w-auto">Revisar Rutina</button>`; }
            html += `</div>`; container.innerHTML = html;
        }
        
        function moveSpaceRoutine(index, direction) { initAudio(); sounds.click(); const newIndex = index + direction; if (newIndex < 0 || newIndex >= routineState.currentItems.length) return; const items = [...routineState.currentItems]; [items[index], items[newIndex]] = [items[newIndex], items[index]]; routineState.currentItems = items; renderSpaceRoutine(); }
        function checkSpaceRoutine() { initAudio(); routineState.isChecked = true; routineState.isCorrect = JSON.stringify(routineState.currentItems) === JSON.stringify(correctRoutine); if (routineState.isCorrect) sounds.espacio_win(); else sounds.espacio_incorrect(); renderSpaceRoutine(); }

    </script>
</body>
</html>

const $=s=>document.querySelector(s),app=$('#app');let sound=false,ctx,section=0,lesson=0,stage=0,game=0,round=0,selected=new Set(),locked=false,points=0,exam=false,answers=[],questions=[];
const f=(n,d)=>`<span class="fraction" aria-label="${n} sobre ${d}"><span>${n}</span><span>${d}</span></span>`;
function tone(ok=true){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();[0,1,2].forEach((x)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=(ok?[523,659,784]:[330,294,262])[x];g.gain.setValueAtTime(.07,ctx.currentTime+x*.1);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+x*.1+.16);o.start(ctx.currentTime+x*.1);o.stop(ctx.currentTime+x*.1+.17)})}catch(e){}}
$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=`♫ Sonido: ${sound?'encendido':'apagado'}`;$('#sound').setAttribute('aria-pressed',sound);tone()};
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
const tabs=['Aprende','Explora','Juega','Prueba'];
function scrollStudyTop(){window.scrollTo({top:0,behavior:'instant'})}
function nav(n){section=n;$('#nav').innerHTML=tabs.map((t,i)=>`<button class="${n===i?'active':''}" ${n===i?'aria-current="page"':''} onclick="nav(${i})"><span class="nav-icon" aria-hidden="true">${['✦','▦','◆','✓'][i]}</span><span>${t}</span></button>`).join('');if(n===0)learn();if(n===1)lab();if(n===2)games();if(n===3){if(exam)examQuestion();else examStart()}scrollStudyTop()}
function heading(tag,title,desc){return `<div class="heading"><span class="tag">${tag}</span><h1>${title}</h1><p class="muted">${desc}</p></div>`}
function bar(d,a,b=0,remove=false,interactive=false){return `<div class="bar" style="--d:${d};--cols:${d===10?5:d>=8?4:d}" role="group" aria-label="Entero dividido en ${d} partes iguales">${Array.from({length:d},(_,i)=>`<${interactive?'button':'div'} class="cell ${i<a?'a':i<a+b?(remove?'removed':'b'):''}" ${interactive?`onclick="paint(${i})" aria-label="Parte ${i+1}" aria-pressed="false"`:''}>${i>=a&&i<a+b&&remove?'×':''}</${interactive?'button':'div'}>`).join('')}</div>`}
const lessons=[{title:'Primero: ¿qué es una fracción?',page:'Repaso · pp. 202–203',desc:'Una fracción nos dice cuántas partes iguales tomamos de un entero.',d:6,a:2,b:0,steps:['Divide el entero en 6 partes iguales. El 6 es el denominador: indica el total de partes.','Toma 2 partes. El 2 es el numerador: indica cuántas partes elegimos.','Magdalena pintó 6 cuadros y regalará 2. Regala 2/6 del total y conserva 4/6. Cada cuadro representa 1/6.'],eq:'2/6',note:'Para representar una fracción, todas las partes deben tener el mismo tamaño.'},
{title:'Sumar es juntar partes',page:'El mural · p. 204',desc:'Los estudiantes pintaron 3/10 del mural de verde y 4/10 de azul. ¿Qué parte pintaron en total?',d:10,a:3,b:4,steps:['El mural está dividido en 10 partes iguales. Ya hay 3 partes pintadas.','Agrega otras 4 partes. Ahora cuenta todas las partes pintadas: 3 + 4 = 7.','El resultado es 7/10. El denominador sigue siendo 10: no cambiamos la división del mural.'],eq:'3/10 + 4/10 = 7/10',note:'Sumamos los numeradores y conservamos el denominador.'},
{title:'Probemos con doce partes',page:'Ejemplo 1 · p. 205',desc:'Representa y resuelve 3/12 + 5/12.',d:12,a:3,b:5,steps:['Dibuja un entero y divídelo en 12 partes iguales. Pinta 3.','Pinta 5 partes más, sin pintar sobre las anteriores.','Hay 8 partes pintadas de 12: 3/12 + 5/12 = 8/12.'],eq:'3/12 + 5/12 = 8/12',note:'¡Cuidado! No es 8/24. Las partes siguen siendo doceavos.'},
{title:'Restar es quitar partes',page:'Las frutillas de Francisca · p. 209',desc:'Francisca compró 7/10 de un kilogramo de frutillas y ocupó 3/10 de kilogramo. ¿Cuánto le quedó?',d:10,a:4,b:3,remove:true,steps:['Representa lo que había: 7 de las 10 partes del kilogramo.','Tacha las 3 partes que usó. Quedan 4 partes sin tachar.','Resta los numeradores: 7 − 3 = 4. Le quedaron 4/10 de kilogramo.'],eq:'7/10 − 3/10 = 4/10',note:'Restamos los numeradores y conservamos el denominador.'},
{title:'¿Cuánto falta para el entero?',page:'El libro de Mauricio · p. 209',desc:'Mauricio leyó 3/8 de un libro el lunes y 2/8 el martes. ¿Qué parte le falta leer?',d:8,a:3,b:2,steps:['Junta lo que ya leyó: 3/8 + 2/8 = 5/8.','El libro completo representa 8/8. Las 3 partes vacías son lo que falta.','Resta al entero: 8/8 − 5/8 = 3/8. Le faltan 3/8 del libro.'],eq:'8/8 − 5/8 = 3/8',note:'Un entero puede escribirse como 8/8, 10/10 o 12/12, según su división.'},
{title:'Resuelve como un detective',page:'Las bolsas de Tatiana · p. 212',desc:'Tatiana regaló 2/8 de sus bolsas y vendió 3/8. ¿Qué fracción del total le queda?',d:8,a:2,b:3,steps:['Comprende: regaló 2/8 y vendió 3/8. Buscamos lo que queda, no lo que salió.','Planifica y resuelve: 2/8 + 3/8 = 5/8. Después: 8/8 − 5/8 = 3/8.','Comprueba: 3/8 que quedan + 5/8 que salieron = 8/8. Respuesta: le quedan 3/8 de las bolsas.'],eq:'8/8 − (2/8 + 3/8) = 3/8',note:'Comprende → planifica → resuelve → comprueba.'},
{title:'Un problema de dos pasos',page:'Matilde y José · p. 213',desc:'Matilde compró 3/5 kg de manzanas. José compró 1/5 kg menos que ella. ¿Cuánto compraron entre ambos?',d:5,a:3,b:2,steps:['Primero calcula cuánto compró José: 3/5 − 1/5 = 2/5 kg. «Menos que Matilde» no significa que compró solo 1/5.','Ahora suma lo de ambos: Matilde compró 3/5 kg y José 2/5 kg.','3/5 + 2/5 = 5/5 = 1. Entre ambos compraron 1 kilogramo.'],eq:'3/5 + 2/5 = 5/5 = 1',note:'Lee la pregunta final: aquí necesitas una resta y luego una suma.'}];
function eq(s){return s.replace(/(\d+)\/(\d+)/g,(_,n,d)=>f(n,d))}
function chooseLesson(i){lesson=+i;stage=0;learn();scrollStudyTop()}
function learn(){let l=lessons[lesson];app.innerHTML=`<div class="mobile-title"><span class="tag">APRENDE · ${lesson+1} DE ${lessons.length}</span><h1>Vamos paso a paso</h1></div><label class="lesson-picker">¿Qué quieres aprender?<select onchange="chooseLesson(this.value)">${lessons.map((v,i)=>`<option value="${i}" ${i===lesson?'selected':''}>${i+1}. ${v.title}</option>`).join('')}</select></label><section class="panel lesson-panel"><span class="small muted">${l.page}</span><h2>${l.title}</h2>${stage===0?`<p>${l.desc}</p>`:''}<div class="step-dots" aria-label="Paso ${stage+1} de 3">${[0,1,2].map(i=>`<span class="${i<=stage?'filled':''}"></span>`).join('')}<b>${stage+1} / 3</b></div><p class="step-text">${l.steps[stage]}</p>${bar(l.d,l.remove&&stage===0?l.a+l.b:l.a,stage===0?0:l.b,l.remove)}<div class="legend"><span><i class="dot"></i>${l.remove?(stage===0?'Lo que había':'Lo que queda'):'Primera cantidad'}</span>${stage>0&&l.b?`<span><i class="dot ${l.remove?'red':'gold'}"></i>${l.remove?'× Lo que se usó':'Segunda cantidad'}</span>`:''}</div><div class="equation">${stage===2?eq(l.eq):f(l.remove&&stage===0?l.a+l.b:l.a,l.d)}</div>${stage===2?`<div class="feedback"><b>Idea clave:</b> ${l.note}</div>`:''}<button class="line-entry" onclick="openLine()">↔ Ver fracciones en la recta</button><div class="lesson-controls"><button ${stage===0&&lesson===0?'disabled':''} onclick="backLesson()" aria-label="Paso anterior">← Atrás</button><button class="primary" onclick="advanceLesson()">${stage<2?'Siguiente →':lesson<lessons.length-1?'Otra lección →':'¡A explorar! →'}</button></div></section>`}
function backLesson(){if(stage>0)stage--;else if(lesson>0){lesson--;stage=2}learn();scrollStudyTop()}
function advanceLesson(){tone();if(stage<2)stage++;else if(lesson<lessons.length-1){lesson++;stage=0}else{nav(1);return}learn();scrollStudyTop()}
let ld=8,la=3,lb=2,lop='+';
function adjust(which,delta){if(which==='a')la=Math.max(0,Math.min(ld,la+delta));if(which==='b')lb=Math.max(0,Math.min(lop==='+'?ld-la:la,lb+delta));lb=Math.min(lb,lop==='+'?ld-la:la);lab()}
function counter(which,val,max,label){return `<div class="counter"><b>${label}</b><div><button aria-label="Quitar una parte de ${label}" ${val===0?'disabled':''} onclick="adjust('${which}',-1)">−</button><span>${f(val,ld)}</span><button aria-label="Agregar una parte a ${label}" ${val>=max?'disabled':''} onclick="adjust('${which}',1)">+</button></div></div>`}
function lab(){app.innerHTML=heading('EXPLORA','Toca y descubre','Usa + y − para cambiar las cantidades.')+`<button class="line-entry" onclick="openLine()">↔ Explorar la recta numérica →</button><div class="panel"><div class="lab-options"><label>Partes iguales<select onchange="ld=+this.value;la=Math.min(la,ld);lb=Math.min(lb,lop==='+'?ld-la:la);lab()">${[3,4,5,6,8,10,12].map(d=>`<option ${ld===d?'selected':''}>${d}</option>`).join('')}</select></label><div><span class="small">¿Qué hacemos?</span><div class="operation-toggle"><button aria-pressed="${lop==='+'}" class="${lop==='+'?'selected':''}" onclick="lop='+';lb=Math.min(lb,ld-la);lab()">Sumar</button><button aria-pressed="${lop==='−'}" class="${lop==='−'?'selected':''}" onclick="lop='−';lb=Math.min(lb,la);lab()">Restar</button></div></div></div>${counter('a',la,ld,'Primera cantidad')}${counter('b',lb,lop==='+'?ld-la:la,lop==='+'?'Agregamos':'Quitamos')}<div class="equation">${f(la,ld)} ${lop} ${f(lb,ld)} = ${f(lop==='+'?la+lb:la-lb,ld)}</div>${bar(ld,lop==='+'?la:la-lb,lb,lop==='−')}<div class="legend"><span><i class="dot"></i>${lop==='+'?'Primera cantidad':'Quedan'}</span><span><i class="dot ${lop==='+'?'gold':'red'}"></i>${lop==='+'?'Agregamos':'× Quitamos'}</span></div><div class="feedback">${la} ${lop} ${lb} = <b>${lop==='+'?la+lb:la-lb}</b>. Las partes siguen siendo de <b>1/${ld}</b>.</div><p class="small muted">Jugamos entre 0 y un entero. ¡Intenta completar ${ld}/${ld}!</p></div>`}
function games(){scrollStudyTop();app.innerHTML=heading('MISIÓN 03 · JUEGA','¡A entrenar tu superpoder!','Cuatro juegos distintos. Sin reloj: lo importante es comprender.')+`<button class="line-entry" onclick="startLineGame()">↔ Nuevo juego: salta en la recta →</button><div class="cards">${[['▦','Pinta la respuesta','Resuelve y toca las partes que representan el resultado.'],['⌕','Detective de errores','Descubre quién tiene razón y por qué.'],['?','La fracción escondida','Encuentra la pieza que falta en la operación.'],['↔','Une las parejas','Relaciona cada operación con su resultado.']].map((a,i)=>`<button class="game" onclick="startGame(${i})"><span class="icon">${a[0]}</span><h2>${a[1]}</h2><p>${a[2]}</p><span class="tag">Jugar →</span></button>`).join('')}</div>`}
const paints=[[3,5,12,'+'],[5,2,8,'+'],[7,3,10,'−'],[4,2,5,'−'],[2,1,3,'+']];const hidden=[[7,6,12,1],[5,3,8,2],[6,4,6,2],[10,7,12,3],[7,4,10,3]];const detectives=[{q:'Claudio dice que 11/12 − 5/12 = 7/12. Daniela dice que es 6/12. ¿Quién tiene razón?',o:['Claudio','Daniela'],a:1,e:'Daniela: 11 − 5 = 6 y el denominador sigue siendo 12. (p. 211)'},{q:'Al sumar 3/7 + 2/7, Tomás obtiene 5/14. ¿Está bien?',o:['Sí, se suman todos','No, es 5/7'],a:1,e:'Solo sumamos los numeradores: 3 + 2 = 5. Las partes siguen siendo séptimos.'},{q:'2/10 + 1/10 + 7/10 representa…',o:['Un entero','Tres enteros'],a:0,e:'2 + 1 + 7 = 10. Entonces 10/10 = 1: todo el curso participa en talleres. (p. 205)'},{q:'Mauricio leyó 3/8 y después 2/8. Ana dice que le faltan 5/8. ¿Es correcto?',o:['Sí','No, le faltan 3/8'],a:1,e:'5/8 es lo que ya leyó. Para hallar lo que falta: 8/8 − 5/8 = 3/8. (p. 209)'}];
function startGame(g){game=g;round=0;points=0;selected=new Set();locked=false;renderGame()}
function gameHead(name,total){return `<button onclick="games()">← Todos los juegos</button>`+heading('JUEGO · '+(round+1)+' DE '+total,name,`Aciertos: ${points}. Cada intento te ayuda a aprender.`)}
function renderGame(){scrollStudyTop();locked=false;selected=new Set();if(game===3){matchGame();return}let total=game===1?4:5;if(round>=total){app.innerHTML=heading('¡RECORRIDO COMPLETO!','Buen entrenamiento',`Conseguiste ${points} de ${total} aciertos al primer intento.`)+`<div class="panel"><div class="badge">✦</div><p>Vuelve a jugar para reforzar lo aprendido o prueba un desafío diferente.</p><div class="actions"><button class="primary" onclick="startGame(${game})">Jugar otra vez</button><button onclick="games()">Elegir otro juego</button></div></div>`;tone();return}if(game===0){let[a,b,d,op]=paints[round];app.innerHTML=gameHead('Pinta la respuesta',5)+`<div class="panel"><p>Resuelve la operación y toca la cantidad de partes del resultado.</p><div class="equation">${f(a,d)} ${op} ${f(b,d)} = ?</div>${bar(d,0,0,false,true)}<p id="paintcount">Pintaste 0 de ${d} partes.</p><button class="primary" onclick="checkPaint()">Comprobar</button><div id="feedback" aria-live="polite"></div></div>`}if(game===1){let q=detectives[round];app.innerHTML=gameHead('Detective de errores',4)+`<div class="panel"><h2>${q.q}</h2><div class="choices">${q.o.map((o,i)=>`<button onclick="detect(${i})">${o}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div></div>`}if(game===2){let[a,b,d,c]=hidden[round];app.innerHTML=gameHead('La fracción escondida',5)+`<div class="panel"><p>¿Qué numerador falta? Conserva el denominador.</p><div class="equation">${f(a,d)} − <span class="fraction"><span><input id="missing" type="number" inputmode="numeric" min="0" max="${d}" aria-label="Numerador que falta"></span><span>${d}</span></span> = ${f(c,d)}</div><button class="primary" onclick="checkHidden()">Descubrir</button><div id="feedback" aria-live="polite"></div></div>`}}
function paint(i){if(locked)return;selected.has(i)?selected.delete(i):selected.add(i);let el=document.querySelectorAll('.cell')[i];el.classList.toggle('a');el.setAttribute('aria-pressed',selected.has(i));$('#paintcount').textContent=`Pintaste ${selected.size} de ${paints[round][2]} partes.`}
function result(ok,explanation){locked=true;if(ok)points++;tone(ok);$('#feedback').innerHTML=`<div class="feedback ${ok?'ok pop':'no'}"><b>${ok?'¡Muy bien!':'Vamos a entenderlo.'}</b> ${explanation}</div><div class="actions"><button class="primary" onclick="round++;renderGame()">Siguiente →</button></div>`;$('#feedback').scrollIntoView({block:'nearest',behavior:'smooth'})}
function checkPaint(){if(locked)return;let[a,b,d,op]=paints[round],r=op==='+'?a+b:a-b;result(selected.size===r,`${a} ${op} ${b} = ${r}. Debes pintar ${r} de las ${d} partes: ${r}/${d}.`)}
function detect(i){if(locked)return;let q=detectives[round];result(i===q.a,q.e)}function checkHidden(){if(locked)return;if($('#missing').value===''){toast('Escribe un numerador primero');return}let[a,b,d,c]=hidden[round];result(+$('#missing').value===b,`${a} − ${b} = ${c}. La fracción escondida es ${b}/${d}. Comprueba: ${c}/${d} + ${b}/${d} = ${a}/${d}.`)}
let matchPick=null,matched=new Set();const pairs=[['3/7 + 2/7','5/7'],['10/12 − 7/12','3/12'],['5/8 − 4/8','1/8'],['3/5 + 2/5','5/5'],['7/10 + 2/10','9/10']];function matchGame(){matched=new Set();matchPick=null;app.innerHTML=`<button onclick="games()">← Todos los juegos</button>`+heading('JUEGO DE PAREJAS','Cada operación tiene su pareja','Toca una operación y después su resultado. Puedes volver a intentarlo.')+`<div class="panel"><div class="match">${pairs.map((p,i)=>`<button id="left${i}" onclick="matchLeft(${i})">${p[0]}</button><button id="right${[2,4,0,1,3][i]}" onclick="matchRight(${[2,4,0,1,3][i]})">${pairs[[2,4,0,1,3][i]][1]}</button>`).join('')}</div><div id="feedback" aria-live="polite" class="feedback">0 de 5 parejas encontradas.</div></div>`}function matchLeft(i){if(matched.has(i))return;document.querySelectorAll('.match .selected').forEach(el=>el.classList.remove('selected'));matchPick=i;$('#left'+i).classList.add('selected')}
function matchRight(i){if(matched.has(i))return;if(matchPick===null){toast('Elige primero una operación');return}if(i===matchPick){matched.add(i);$('#left'+i).className='matched';$('#right'+i).className='matched';$('#left'+i).disabled=true;$('#right'+i).disabled=true;matchPick=null;tone();$('#feedback').innerHTML=matched.size===5?'¡Encontraste todas! <button onclick="games()">Elegir otro juego</button>':`${matched.size} de 5 parejas encontradas.`}else{tone(false);$('#feedback').textContent='Todavía no. Calcula los numeradores y conserva el denominador. Inténtalo otra vez.'}}
const bank=[
{q:'¿Qué indica el denominador de una fracción?',o:['Las partes que tomo','El total de partes iguales','La cantidad que sumo'],a:1,e:'El denominador indica en cuántas partes iguales se divide el entero.',t:'Conceptos'},
{q:'Resuelve: 5/12 + 4/12.',o:['9/24','1/12','9/12'],a:2,e:'5 + 4 = 9. Conserva el 12: el resultado es 9/12. (p. 206)',t:'Sumas'},
{q:'Alberto dedica 2/8 del día a estudiar y 3/8 a dormir. ¿Qué fracción dedica a ambas actividades?',o:['5/8','5/16','1/8'],a:0,e:'Junta ambas actividades: 2/8 + 3/8 = 5/8 del día. (p. 206)',t:'Problemas'},
{q:'Marcela destina 16/100 del museo al arte barroco y 7/100 al arte moderno. ¿Cuánto destina a ambos?',o:['9/100','23/200','23/100'],a:2,e:'16 + 7 = 23. Destina 23/100 del museo. (p. 207)',t:'Sumas'},
{q:'Resuelve: 9/12 − 6/12.',o:['3/0','3/12','15/12'],a:1,e:'9 − 6 = 3. El denominador no se resta: 3/12. (p. 210)',t:'Restas'},
{q:'Completa: 7/12 − ? = 1/12.',o:['6/12','8/12','1/12'],a:0,e:'7 − 6 = 1. Falta 6/12. Puedes comprobar: 1/12 + 6/12 = 7/12. (p. 210)',t:'Restas'},
{q:'En una campaña, 3/8 del curso donó pastas, 1/8 azúcar y 2/8 arroz. Si cada estudiante donó un solo tipo, ¿qué fracción no participó?',o:['6/8','2/8','3/8'],a:1,e:'Participó 3/8 + 1/8 + 2/8 = 6/8. No participó 8/8 − 6/8 = 2/8. (p. 211)',t:'Problemas'},
{q:'Matilde compró 3/5 kg de manzanas. José compró 1/5 kg menos que ella. ¿Cuánto compraron entre ambos?',o:['4/5 kg','2/5 kg','1 kg'],a:2,e:'José compró 3/5 − 1/5 = 2/5 kg. Juntos: 3/5 + 2/5 = 5/5 = 1 kg. (p. 213)',t:'Problemas'},
{q:'En la sala de música, 4/12 se usa para ensayar. Se quita 1/12 del total de la sala a ese sector. ¿Cuánto queda para ensayar?',o:['3/12','5/12','3/11'],a:0,e:'4/12 − 1/12 = 3/12 del total de la sala. (p. 215)',t:'Restas'},
{q:'En el círculo cromático hay 3/12 de colores primarios y 6/12 de terciarios. ¿Qué fracción representan juntos?',o:['9/24','3/12','9/12'],a:2,e:'3/12 + 6/12 = 9/12 del círculo. (p. 214)',t:'Sumas'},
{q:'¿Cuál de estas fracciones representa un entero?',o:['1/8','8/8','0/8'],a:1,e:'8/8 representa todas las ocho partes del entero.',t:'Conceptos'},
{q:'Un dibujo tiene 8 partes iguales y 5 están pintadas. ¿Qué fracción falta pintar?',o:['3/8','5/8','8/5'],a:0,e:'El entero es 8/8. Falta 8/8 − 5/8 = 3/8.',t:'Conceptos'}];
function examStart(){exam=false;app.innerHTML=heading('MISIÓN 04 · PREPÁRATE','Ensaya antes de la prueba','Una práctica para descubrir lo que ya dominas y lo que puedes reforzar.')+`<div class="panel"><span class="tag">12 PREGUNTAS · SIN LÍMITE DE TIEMPO</span><h2>¡Tú puedes hacerlo!</h2><p>Encontrarás sumas, restas, fracciones que faltan y problemas del material. Elige una respuesta en cada pregunta. Al terminar verás tu resultado y la explicación de cada ejercicio.</p><div class="feedback"><b>Antes de responder:</b> lee qué te preguntan, identifica los datos y decide si debes juntar, quitar o completar un entero.</div><p class="small muted">Es una práctica de estudio basada en el PDF; no es la prueba oficial del colegio.</p><button class="primary" onclick="beginExam()">Comenzar práctica →</button></div>`}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function beginExam(){exam=true;questions=shuffle(bank).map(q=>{let opts=q.o.map((v,i)=>({v,correct:i===q.a}));opts=shuffle(opts);return {...q,o:opts.map(o=>o.v),a:opts.findIndex(o=>o.correct)}});answers=Array(questions.length).fill(null);round=0;examQuestion()}
function examQuestion(){let q=questions[round];app.innerHTML=heading('PRÁCTICA · PREGUNTA '+(round+1)+' DE '+questions.length,'Piensa con calma','Puedes retroceder y revisar tus respuestas antes de finalizar.')+`<div class="progress" role="progressbar" aria-valuenow="${round+1}" aria-valuemin="0" aria-valuemax="${questions.length}" aria-label="Avance de la práctica"><i style="width:${(round+1)/questions.length*100}%"></i></div><div class="panel"><h2>${q.q}</h2><div class="choices">${q.o.map((o,i)=>`<button style="${answers[round]===i?'border-color:#2556dc;background:#e7eeff':''}" aria-pressed="${answers[round]===i}" onclick="answers[round]=${i};examQuestion()">${o}</button>`).join('')}</div><div class="actions">${round>0?'<button onclick="round--;examQuestion();scrollStudyTop()">← Anterior</button>':''}<button class="primary" ${answers[round]===null?'disabled':''} onclick="${round<questions.length-1?'round++;examQuestion();scrollStudyTop()':'examResult()'}">${round<questions.length-1?'Siguiente →':'Ver mi resultado'}</button></div></div>`}
function examResult(){scrollStudyTop();exam=false;let score=questions.filter((q,i)=>answers[i]===q.a).length,weak=[...new Set(questions.filter((q,i)=>answers[i]!==q.a).map(q=>q.t))];tone(score>=8);app.innerHTML=heading('PRÁCTICA TERMINADA',score===12?'¡Dominaste las fracciones!':'Cada intento te hace avanzar','Ahora revisa las explicaciones para aprender de tus respuestas.')+`<div class="panel"><div class="score">${score} <span class="muted" style="font-size:24px">/ 12 aciertos</span></div><p>${weak.length?'Te conviene repasar: <b>'+weak.join(', ')+'</b>.':'¡Muy bien! Explica con tus palabras por qué conservamos el denominador.'}</p><div class="actions"><button class="primary" onclick="beginExam()">Practicar otra vez</button><button onclick="lesson=0;stage=0;nav(0)">Repasar las lecciones</button></div></div>${questions.map((q,i)=>`<div class="panel"><span class="tag">${answers[i]===q.a?'✓ CORRECTA':'↻ PARA REPASAR'} · ${q.t}</span><h3>${i+1}. ${q.q}</h3><p>Tu respuesta: <b>${q.o[answers[i]]}</b></p><div class="feedback ${answers[i]===q.a?'ok':'no'}">${q.e}</div></div>`).join('')}`}

let nd=8,na=3,nb=2,nop='+',nj=0,ncursor=0,nround=0,nscore=0,nlocked=false;
const lineTasks=[{d:4,a:0,b:3,op:'ubica'},{d:8,a:3,b:2,op:'+'},{d:10,a:7,b:3,op:'−'},{d:12,a:3,b:5,op:'+'},{d:6,a:6,b:4,op:'−'},{d:5,a:3,b:2,op:'+'}];
function numericLine(d,start,end,steps=0,op='+',cursor=null){let w=Math.max(340,d*48+64),x=n=>32+n*(w-64)/d,dir=op==='−'?-1:1;return `<div class="numberline-scroll" tabindex="0" role="region" aria-label="Recta numérica de cero a uno, dividida en ${d} intervalos iguales. Desliza horizontalmente para recorrerla."><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} 180" style="width:${w}px" role="img" aria-label="${cursor===null?`Inicio ${start}/${d}, posición actual ${start+dir*steps}/${d}`:`Punto elegido: ${cursor}/${d}`}"><line x1="${x(0)}" y1="105" x2="${x(d)}" y2="105" stroke="#172949" stroke-width="3"/>${Array.from({length:d+1},(_,i)=>`<line x1="${x(i)}" y1="97" x2="${x(i)}" y2="114" stroke="#172949" stroke-width="2"/><text x="${x(i)}" y="140" text-anchor="middle" font-size="15" fill="#172949" font-family="Arial">${i}/${d}</text>${i===0||i===d?`<text x="${x(i)}" y="164" text-anchor="middle" font-size="15" font-weight="bold" fill="#2556dc">${i===0?'0':'1'}</text>`:''}`).join('')}${Array.from({length:steps},(_,i)=>{let a=x(start+dir*i),b=x(start+dir*(i+1));return `<path class="number-jump" d="M ${a} 92 Q ${(a+b)/2} 30 ${b} 92" fill="none" stroke="${dir===1?'#2556dc':'#c64953'}" stroke-width="3"/><path d="M ${b-5} 83 L ${b} 92 L ${b+5} 83" fill="none" stroke="${dir===1?'#2556dc':'#c64953'}" stroke-width="3"/>`}).join('')}<circle cx="${x(start)}" cy="105" r="6" fill="#f6bd35" stroke="#765707" stroke-width="2"/><circle cx="${x(cursor===null?start+dir*steps:cursor)}" cy="105" r="9" fill="#2556dc" stroke="white" stroke-width="3"/></svg></div><p class="small muted line-scroll-hint">↔ Desliza la recta para ver todas las marcas.</p>`}
function openLine(){nj=0;lineExplore();scrollStudyTop()}
function resetLine(){nj=0;nb=Math.min(nb,nop==='+'?nd-na:na);lineExplore()}
function lineChange(which,delta){if(which==='a')na=Math.max(0,Math.min(nd,na+delta));else nb=Math.max(0,Math.min(nop==='+'?nd-na:na,nb+delta));resetLine()}
function lineExplore(){let end=nop==='+'?na+nb:na-nb;app.innerHTML=`<button onclick="nav(1)">← Explora</button>`+heading('RECTAS NUMÉRICAS','¡Avanza y retrocede!','Cada espacio entre dos marcas vale una parte.')+`<section class="panel"><div class="lab-options"><label>Partes entre 0 y 1<select onchange="nd=+this.value;na=Math.min(na,nd);resetLine()">${[3,4,5,6,8,10,12].map(d=>`<option ${d===nd?'selected':''}>${d}</option>`).join('')}</select></label><div class="operation-toggle"><button class="${nop==='+'?'selected':''}" onclick="nop='+';resetLine()">Sumar →</button><button class="${nop==='−'?'selected':''}" onclick="nop='−';resetLine()">← Restar</button></div></div>${[['a',na,nd,'Empieza en'],['b',nb,nop==='+'?nd-na:na,'Cantidad de saltos']].map(([k,v,max,label])=>`<div class="counter"><b>${label}</b><div><button aria-label="Disminuir ${label}" ${v===0?'disabled':''} onclick="lineChange('${k}',-1)">−</button><span>${k==='a'?f(v,nd):v}</span><button aria-label="Aumentar ${label}" ${v===max?'disabled':''} onclick="lineChange('${k}',1)">+</button></div></div>`).join('')}<div class="equation">${f(na,nd)} ${nop} ${f(nb,nd)} = ${nj===nb?f(end,nd):'?'}</div><div id="line-drawing">${numericLine(nd,na,end,nj,nop)}</div><p class="line-status" aria-live="polite">${nj===0?`Empieza en ${na}/${nd}.`: `Llevas ${nj} de ${nb} saltos. Estás en ${nop==='+'?na+nj:na-nj}/${nd}.`}</p><div class="actions"><button class="primary" ${nj>=nb?'disabled':''} onclick="nj++;tone();lineExplore()">${nop==='+'?'Saltar a la derecha →':'← Saltar a la izquierda'}</button><button onclick="nj=0;lineExplore()">Repetir</button></div><div class="feedback">${nj===nb?`¡Llegaste a <b>${end}/${nd}</b>! `:''}Para ${nop==='+'?'sumar avanzas hacia la derecha':'restar retrocedes hacia la izquierda'}. Cada salto vale <b>1/${nd}</b>.</div><details class="line-help"><summary>¿Cómo se lee una recta?</summary><p>El tramo de 0 a 1 es un entero. Divídelo en ${nd} <b>espacios iguales</b>. Hay ${nd+1} marcas, pero ${nd} espacios. Para ubicar 3/${nd}, cuenta 3 espacios desde el cero.</p><p>El denominador indica los espacios del entero y el numerador, cuántos avanzas desde cero.</p></details></section><button class="line-entry" onclick="startLineGame()">Practicar con un juego →</button>`}
function startLineGame(){nround=0;nscore=0;nextLineTask();scrollStudyTop()}
function nextLineTask(){nlocked=false;ncursor=0;lineGame()}
function moveCursor(delta){ncursor=Math.max(0,Math.min(lineTasks[nround].d,ncursor+delta));lineGame()}
function lineGame(){if(nround>=lineTasks.length){app.innerHTML=heading('¡RECTA COMPLETADA!','¡Buen trabajo!',`${nscore} de ${lineTasks.length} respuestas correctas.`)+`<section class="panel"><p>Recuerda: cuenta espacios, no marcas. Suma hacia la derecha y resta hacia la izquierda.</p><div class="actions"><button class="primary" onclick="startLineGame()">Jugar otra vez</button><button onclick="games()">Otros juegos</button></div></section>`;return}let t=lineTasks[nround];app.innerHTML=`<button onclick="games()">← Juegos</button>`+heading(`RETO ${nround+1} DE ${lineTasks.length}`,'Encuentra el punto',t.op==='ubica'?`Ubica ${t.b}/${t.d} en la recta.`:`¿Dónde termina ${t.a}/${t.d} ${t.op} ${t.b}/${t.d}?`)+`<section class="panel"><p>Mueve el punto azul con los botones. Luego toca <b>Comprobar</b>.</p>${numericLine(t.d,0,0,0,'+',ncursor)}<div class="cursor-controls"><button ${ncursor===0||nlocked?'disabled':''} onclick="moveCursor(-1)" aria-label="Mover una parte a la izquierda">←</button><span aria-live="polite">${f(ncursor,t.d)}</span><button ${ncursor===t.d||nlocked?'disabled':''} onclick="moveCursor(1)" aria-label="Mover una parte a la derecha">→</button></div><button class="primary line-check" ${nlocked?'disabled':''} onclick="checkLine()">Comprobar</button><div id="line-feedback" aria-live="polite"></div></section>`}
function checkLine(){if(nlocked)return;nlocked=true;let t=lineTasks[nround],answer=t.op==='ubica'?t.b:t.op==='+'?t.a+t.b:t.a-t.b,ok=ncursor===answer;if(ok)nscore++;tone(ok);lineGame();$('#line-feedback').innerHTML=`<div class="feedback ${ok?'ok':'no'}"><b>${ok?'¡Lo encontraste!':'Revisemos juntos.'}</b> ${t.op==='ubica'?`Desde cero, avanza ${t.b} espacios de 1/${t.d}.`: `Desde ${t.a}/${t.d}, ${t.op==='+'?'avanza':'retrocede'} ${t.b} espacios de 1/${t.d}.`} Llegas a <b>${answer}/${t.d}</b>.</div>${numericLine(t.d,t.op==='ubica'?0:t.a,answer,t.b,t.op==='−'?'−':'+')}<button class="primary line-check" onclick="nround++;nextLineTask();scrollStudyTop()">${nround===lineTasks.length-1?'Ver resultado':'Siguiente reto →'}</button>`}
nav(0);

</script></body></html>

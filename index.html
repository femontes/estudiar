<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misión Fracciones · 4° básico</title><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
:root{font-family:Nunito,Arial,sans-serif;color:#172949;background:#f3f6fc;font-size:18px}*{box-sizing:border-box}body{margin:0}button,a,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:12px 20px;background:#eaf0fa;color:#172949;font-weight:800;transition:transform .15s,background .15s}button:hover{transform:translateY(-2px);background:#dce5f7}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #f6b629;outline-offset:3px}button:disabled{cursor:default;transform:none;opacity:.65}header{height:98px;background:white;border-bottom:1px solid #e0e7f2;display:flex;align-items:center;gap:24px;padding:18px 4vw}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#2556dc;font-size:48px;font-weight:900;line-height:1}.brand span{font-size:19px;letter-spacing:1px}.grade{font-size:14px;font-weight:900;letter-spacing:1.5px;color:#687892;margin-left:auto}#sound{font-size:15px;border:1px solid #dce3ee;background:white}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1450px;margin:auto;min-height:calc(100vh - 98px)}aside{padding:35px 24px;border-right:1px solid #dce4f0}.eyebrow{font-size:12px;font-weight:900;letter-spacing:1.7px;color:#65758e}nav{display:grid;gap:9px;margin:24px 0}nav button{text-align:left;background:transparent;font-size:17px;padding:15px 13px}nav button.active{background:#2556dc;color:white;box-shadow:0 6px 15px #2556dc25}.tip{background:#fff3c9;border-radius:18px;padding:20px;margin-top:36px;font-size:15px}.tip p{line-height:1.6}.rule{font-size:29px;font-weight:900}.source{font-size:13px;color:#65758e;line-height:1.6;margin-top:30px}main{padding:34px 42px;min-width:0}h1{font-size:clamp(30px,3vw,43px);line-height:1.15;margin:12px 0}h2{font-size:25px;margin:10px 0 16px}h3{margin:8px 0;font-size:19px}p{line-height:1.6}.muted{color:#63728b}.tag{display:inline-block;padding:6px 11px;border-radius:7px;background:#e5ecff;color:#2556dc;font-size:13px;letter-spacing:.7px;font-weight:900}.heading{margin-bottom:26px}.panel{background:white;border:1px solid #e0e6f0;border-radius:24px;padding:28px;margin-bottom:22px;box-shadow:0 6px 0 #e6ebf5}.blue{background:#2556dc;color:white;border:0}.blue .muted{color:#e2eaff}.split{display:grid;grid-template-columns:1.35fr 1fr;gap:22px}.fraction{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;font-weight:900;line-height:1.2;margin:0 8px;min-width:28px}.fraction span:first-child{border-bottom:2px solid;padding-bottom:3px}.fraction span:last-child{padding-top:3px}.equation{font-size:32px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;padding:25px 8px}.bar{display:grid;gap:5px;margin:25px 0;grid-template-columns:repeat(var(--d),minmax(0,1fr))}.cell{min-width:0;border-radius:8px;background:#e9eef7;border:2px solid #c6d2e7;min-height:64px;padding:0;color:#243c6a}.cell.a{background:#3565eb;border-color:#2556dc;color:white}.cell.b{background:#f6bd35;border-color:#e7a719;color:#553b00}.cell.removed{background:#ffd9da;border-color:#ef9aa2;color:#a62a39}.blue .cell{border-color:white}.legend{display:flex;flex-wrap:wrap;gap:20px;font-size:15px}.dot{display:inline-block;width:13px;height:13px;background:#3565eb;border-radius:4px;margin-right:7px}.dot.gold{background:#f6bd35}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:24px}.primary{background:#2556dc;color:white;box-shadow:0 4px 0 #183eac}.primary:hover{background:#1747c9}.yellow{background:#ffd368;color:#172949;box-shadow:0 4px 0 #d7a83b}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.game{background:white;border:1px solid #dce4f0;border-radius:20px;padding:25px;text-align:left;min-height:170px}.game .icon{font-size:32px}.game p{font-size:16px;font-weight:600;color:#64738c}.steps{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.steps button{font-size:15px}.steps button.selected{background:#172949;color:white}.feedback{padding:18px;border-radius:14px;background:#eef3ff;margin-top:20px;line-height:1.6;border-left:5px solid #2556dc}.feedback.ok{background:#e4f6ef;border-color:#189365}.feedback.no{background:#fff1da;border-color:#de9812}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.choices button{background:white;border:2px solid #cdd8ed;min-height:74px;font-size:24px}.choices button.correct{background:#def6e9;border-color:#259c69}.choices button.wrong{background:#fff0d6;border-color:#d79524}input{width:90px;padding:12px;border:2px solid #bfcee5;border-radius:10px;text-align:center;font-size:24px}select{border:1px solid #c6d2e7;border-radius:10px;background:white;padding:12px;max-width:100%}.progress{height:10px;border-radius:8px;background:#dae4f6;overflow:hidden;margin:15px 0}.progress i{display:block;height:100%;background:#2556dc;transition:width .3s}.small{font-size:14px}.badge{font-size:70px}.score{font-size:55px;font-weight:900;color:#2556dc}.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}.match button{min-height:64px}.match .selected{background:#ffd368}.match .matched{background:#d9f5e8;color:#176c4c}.pop{animation:pop .35s ease}.checkrow{display:flex;gap:12px;align-items:center;margin:14px 0}.checkrow input{width:auto}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#172949;color:white;border-radius:20px;padding:12px 24px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:5}#toast.show{opacity:1}@keyframes pop{50%{transform:scale(1.03)}}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{padding:15px 20px;border:0}.tip,.source,aside>.eyebrow{display:none}nav{display:flex;overflow:auto;margin:0;gap:5px}nav button{white-space:nowrap;font-size:15px}main{padding:20px}.split{grid-template-columns:1fr}header{height:85px;padding:16px}.grade{display:none}#sound{margin-left:auto}.cell{min-height:48px}.cards{gap:12px}.panel{padding:22px}}@media(max-width:480px){.cards{grid-template-columns:1fr}.choices{gap:9px}.bar{gap:3px}.cell{border-radius:4px}.brand span{font-size:15px}.brand{font-size:35px}#sound{font-size:13px;padding:10px}.equation{font-size:26px}.fraction{margin:0 5px}main{padding:15px}.panel{padding:18px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style></head><body><header><a href="#" class="brand">✳ <span>MISIÓN<br>FRACCIONES</span></a><span class="grade">MATEMÁTICA · 4° BÁSICO</span><button id="sound" aria-pressed="false">♫ Sonido: apagado</button></header><div class="layout"><aside><p class="eyebrow">TU RUTA DE APRENDIZAJE</p><nav id="nav"></nav><div class="tip"><b>Tu superpoder</b><p>Las partes siguen siendo del mismo tamaño. ¡El denominador se queda!</p><div class="rule">⅛ + ⅛ = ²⁄₈</div></div><p class="source">Unidad 3 · Tema 2<br>Basado en tu material, pp. 202–215.</p></aside><main id="app"></main></div><div id="toast" role="status" aria-live="polite"></div><script>
const $=s=>document.querySelector(s),app=$('#app');let sound=false,ctx,section=0,lesson=0,stage=0,game=0,round=0,selected=new Set(),locked=false,points=0,exam=false,answers=[],questions=[];
const f=(n,d)=>`<span class="fraction" aria-label="${n} sobre ${d}"><span>${n}</span><span>${d}</span></span>`;
function tone(ok=true){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();[0,1,2].forEach((x)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=(ok?[523,659,784]:[330,294,262])[x];g.gain.setValueAtTime(.07,ctx.currentTime+x*.1);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+x*.1+.16);o.start(ctx.currentTime+x*.1);o.stop(ctx.currentTime+x*.1+.17)})}catch(e){}}
$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=`♫ Sonido: ${sound?'encendido':'apagado'}`;$('#sound').setAttribute('aria-pressed',sound);tone()};
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
const tabs=['✦ Aprende','▦ Laboratorio','◆ Juegos','✓ Practica tu prueba'];function nav(n){section=n;$('#nav').innerHTML=tabs.map((t,i)=>`<button class="${n===i?'active':''}" ${n===i?'aria-current="page"':''} onclick="nav(${i})">${t}</button>`).join('');if(n===0)learn();if(n===1)lab();if(n===2)games();if(n===3)examStart()}
function heading(tag,title,desc){return `<div class="heading"><span class="tag">${tag}</span><h1>${title}</h1><p class="muted">${desc}</p></div>`}
function bar(d,a,b=0,remove=false,interactive=false){return `<div class="bar" style="--d:${d}" role="group" aria-label="Entero dividido en ${d} partes iguales">${Array.from({length:d},(_,i)=>`<${interactive?'button':'div'} class="cell ${i<a?'a':i<a+b?(remove?'removed':'b'):''}" ${interactive?`onclick="paint(${i})" aria-label="Parte ${i+1}" aria-pressed="false"`:''}>${i>=a&&i<a+b&&remove?'×':''}</${interactive?'button':'div'}>`).join('')}</div>`}
const lessons=[{title:'Primero: ¿qué es una fracción?',page:'Repaso · pp. 202–203',desc:'Una fracción nos dice cuántas partes iguales tomamos de un entero.',d:6,a:2,b:0,steps:['Divide el entero en 6 partes iguales. El 6 es el denominador: indica el total de partes.','Toma 2 partes. El 2 es el numerador: indica cuántas partes elegimos.','Magdalena pintó 6 cuadros y regalará 2. Regala 2/6 del total y conserva 4/6. Cada cuadro representa 1/6.'],eq:'2/6',note:'Para representar una fracción, todas las partes deben tener el mismo tamaño.'},
{title:'Sumar es juntar partes',page:'El mural · p. 204',desc:'Los estudiantes pintaron 3/10 del mural de verde y 4/10 de azul. ¿Qué parte pintaron en total?',d:10,a:3,b:4,steps:['El mural está dividido en 10 partes iguales. Ya hay 3 partes pintadas.','Agrega otras 4 partes. Ahora cuenta todas las partes pintadas: 3 + 4 = 7.','El resultado es 7/10. El denominador sigue siendo 10: no cambiamos la división del mural.'],eq:'3/10 + 4/10 = 7/10',note:'Sumamos los numeradores y conservamos el denominador.'},
{title:'Probemos con doce partes',page:'Ejemplo 1 · p. 205',desc:'Representa y resuelve 3/12 + 5/12.',d:12,a:3,b:5,steps:['Dibuja un entero y divídelo en 12 partes iguales. Pinta 3.','Pinta 5 partes más, sin pintar sobre las anteriores.','Hay 8 partes pintadas de 12: 3/12 + 5/12 = 8/12.'],eq:'3/12 + 5/12 = 8/12',note:'¡Cuidado! No es 8/24. Las partes siguen siendo doceavos.'},
{title:'Restar es quitar partes',page:'Las frutillas de Francisca · p. 209',desc:'Francisca compró 7/10 de un kilogramo de frutillas y ocupó 3/10 de kilogramo. ¿Cuánto le quedó?',d:10,a:4,b:3,remove:true,steps:['Representa lo que había: 7 de las 10 partes del kilogramo.','Tacha las 3 partes que usó. Quedan 4 partes sin tachar.','Resta los numeradores: 7 − 3 = 4. Le quedaron 4/10 de kilogramo.'],eq:'7/10 − 3/10 = 4/10',note:'Restamos los numeradores y conservamos el denominador.'},
{title:'¿Cuánto falta para el entero?',page:'El libro de Mauricio · p. 209',desc:'Mauricio leyó 3/8 de un libro el lunes y 2/8 el martes. ¿Qué parte le falta leer?',d:8,a:3,b:2,steps:['Junta lo que ya leyó: 3/8 + 2/8 = 5/8.','El libro completo representa 8/8. Las 3 partes vacías son lo que falta.','Resta al entero: 8/8 − 5/8 = 3/8. Le faltan 3/8 del libro.'],eq:'8/8 − 5/8 = 3/8',note:'Un entero puede escribirse como 8/8, 10/10 o 12/12, según su división.'},
{title:'Resuelve como un detective',page:'Las bolsas de Tatiana · p. 212',desc:'Tatiana regaló 2/8 de sus bolsas y vendió 3/8. ¿Qué fracción del total le queda?',d:8,a:2,b:3,steps:['Comprende: regaló 2/8 y vendió 3/8. Buscamos lo que queda, no lo que salió.','Planifica y resuelve: 2/8 + 3/8 = 5/8. Después: 8/8 − 5/8 = 3/8.','Comprueba: 3/8 que quedan + 5/8 que salieron = 8/8. Respuesta: le quedan 3/8 de las bolsas.'],eq:'8/8 − (2/8 + 3/8) = 3/8',note:'Comprende → planifica → resuelve → comprueba.'},
{title:'Un problema de dos pasos',page:'Matilde y José · p. 213',desc:'Matilde compró 3/5 kg de manzanas. José compró 1/5 kg menos que ella. ¿Cuánto compraron entre ambos?',d:5,a:3,b:2,steps:['Primero calcula cuánto compró José: 3/5 − 1/5 = 2/5 kg. «Menos que Matilde» no significa que compró solo 1/5.','Ahora suma lo de ambos: Matilde compró 3/5 kg y José 2/5 kg.','3/5 + 2/5 = 5/5 = 1. Entre ambos compraron 1 kilogramo.'],eq:'3/5 + 2/5 = 5/5 = 1',note:'Lee la pregunta final: aquí necesitas una resta y luego una suma.'}];
function eq(s){return s.replace(/(\d+)\/(\d+)/g,(_,n,d)=>f(n,d))}
function learn(){let l=lessons[lesson];app.innerHTML=heading('MISIÓN 01 · APRENDE','Las fracciones, parte por parte','Mira, prueba y descubre. Aquí puedes avanzar a tu ritmo.')+`<div class="steps">${lessons.map((l,i)=>`<button class="${i===lesson?'selected':''}" onclick="lesson=${i};stage=0;learn()">${i+1}. ${['Fracciones','Sumar','Doceavos','Restar','El entero','Tatiana','Dos pasos'][i]}</button>`).join('')}</div><div class="split"><section class="panel"><span class="tag">${l.page}</span><h2>${l.title}</h2><p>${l.desc}</p>${bar(l.d,l.remove&&stage===0?l.a+l.b:l.a,stage===0?0:l.b,l.remove)}<div class="legend"><span><i class="dot"></i>${l.remove?'Lo que queda':'Primera cantidad'}</span>${stage>0&&l.b?`<span><i class="dot gold"></i>${l.remove?'× Lo que se usó':'Segunda cantidad'}</span>`:''}</div><div class="equation">${stage===2?eq(l.eq):f(l.remove&&stage===0?l.a+l.b:l.a,l.d)}</div></section><section class="panel blue"><span class="small">PASO ${stage+1} DE 3</span><h2>${['Observa','Piensa','¡Comprueba!'][stage]}</h2><p style="font-size:22px">${l.steps[stage]}</p><div class="actions"><button class="yellow" onclick="advanceLesson()">${stage<2?'Siguiente paso →':'¡Lo entendí! →'}</button>${stage>0?'<button onclick="stage--;learn()">Atrás</button>':''}</div></section></div><div class="feedback"><b>Recuerda:</b> ${l.note}</div>`}
function advanceLesson(){tone();if(stage<2)stage++;else if(lesson<lessons.length-1){lesson++;stage=0}else{nav(1);return}learn()}
let ld=8,la=3,lb=2,lop='+';function lab(){app.innerHTML=heading('MISIÓN 02 · EXPERIMENTA','Tu laboratorio de fracciones','Cambia las cantidades y observa qué ocurre con las partes.')+`<div class="panel"><div class="actions"><label>Partes del entero <select onchange="ld=+this.value;la=Math.min(la,ld);lb=Math.min(lb,lop==='+'?ld-la:la);lab()">${[3,4,5,6,8,10,12].map(d=>`<option ${ld===d?'selected':''}>${d}</option>`).join('')}</select></label><label>Operación <select onchange="lop=this.value;lb=Math.min(lb,lop==='+'?ld-la:la);lab()"><option ${lop==='+'?'selected':''}>+</option><option ${lop==='−'?'selected':''}>−</option></select></label></div><div class="equation"><label><input aria-label="Primer numerador" type="number" min="0" max="${ld}" value="${la}" onchange="la=Math.max(0,Math.min(ld,Math.floor(+this.value)));lb=Math.min(lb,lop==='+'?ld-la:la);lab()"> / ${ld}</label> ${lop} <label><input aria-label="Segundo numerador" type="number" min="0" max="${lop==='+'?ld-la:la}" value="${lb}" onchange="lb=Math.max(0,Math.min(lop==='+'?ld-la:la,Math.floor(+this.value)));lab()"> / ${ld}</label> = ${f(lop==='+'?la+lb:la-lb,ld)}</div>${bar(ld,lop==='+'?la:la-lb,lb,lop==='−')}<div class="legend"><span><i class="dot"></i>${lop==='+'?'Primera cantidad':'Quedan'}</span><span><i class="dot gold"></i>${lop==='+'?'Se agregan':'× Se quitan'}</span></div><div class="feedback">${la} ${lop} ${lb} = <b>${lop==='+'?la+lb:la-lb}</b>. El denominador sigue siendo <b>${ld}</b>, porque el entero sigue dividido en ${ld} partes iguales.</div><p class="small muted">En este laboratorio trabajamos con cantidades entre cero y un entero. Prueba obtener ${ld}/${ld} o 0/${ld}.</p></div>`}
function games(){app.innerHTML=heading('MISIÓN 03 · JUEGA','¡A entrenar tu superpoder!','Cuatro juegos distintos. Sin reloj: lo importante es comprender.')+`<div class="cards">${[['▦','Pinta la respuesta','Resuelve y toca las partes que representan el resultado.'],['⌕','Detective de errores','Descubre quién tiene razón y por qué.'],['?','La fracción escondida','Encuentra la pieza que falta en la operación.'],['↔','Une las parejas','Relaciona cada operación con su resultado.']].map((a,i)=>`<button class="game" onclick="startGame(${i})"><span class="icon">${a[0]}</span><h2>${a[1]}</h2><p>${a[2]}</p><span class="tag">Jugar →</span></button>`).join('')}</div>`}
const paints=[[3,5,12,'+'],[5,2,8,'+'],[7,3,10,'−'],[4,2,5,'−'],[2,1,3,'+']];const hidden=[[7,6,12,1],[5,3,8,2],[6,4,6,2],[10,7,12,3],[7,4,10,3]];const detectives=[{q:'Claudio dice que 11/12 − 5/12 = 7/12. Daniela dice que es 6/12. ¿Quién tiene razón?',o:['Claudio','Daniela'],a:1,e:'Daniela: 11 − 5 = 6 y el denominador sigue siendo 12. (p. 211)'},{q:'Al sumar 3/7 + 2/7, Tomás obtiene 5/14. ¿Está bien?',o:['Sí, se suman todos','No, es 5/7'],a:1,e:'Solo sumamos los numeradores: 3 + 2 = 5. Las partes siguen siendo séptimos.'},{q:'2/10 + 1/10 + 7/10 representa…',o:['Un entero','Tres enteros'],a:0,e:'2 + 1 + 7 = 10. Entonces 10/10 = 1: todo el curso participa en talleres. (p. 205)'},{q:'Mauricio leyó 3/8 y después 2/8. Ana dice que le faltan 5/8. ¿Es correcto?',o:['Sí','No, le faltan 3/8'],a:1,e:'5/8 es lo que ya leyó. Para hallar lo que falta: 8/8 − 5/8 = 3/8. (p. 209)'}];
function startGame(g){game=g;round=0;points=0;selected=new Set();locked=false;renderGame()}
function gameHead(name,total){return `<button onclick="games()">← Todos los juegos</button>`+heading('JUEGO · '+(round+1)+' DE '+total,name,`Aciertos: ${points}. Cada intento te ayuda a aprender.`)}
function renderGame(){locked=false;selected=new Set();if(game===3){matchGame();return}let total=game===1?4:5;if(round>=total){app.innerHTML=heading('¡RECORRIDO COMPLETO!','Buen entrenamiento',`Conseguiste ${points} de ${total} aciertos al primer intento.`)+`<div class="panel"><div class="badge">✦</div><p>Vuelve a jugar para reforzar lo aprendido o prueba un desafío diferente.</p><div class="actions"><button class="primary" onclick="startGame(${game})">Jugar otra vez</button><button onclick="games()">Elegir otro juego</button></div></div>`;tone();return}if(game===0){let[a,b,d,op]=paints[round];app.innerHTML=gameHead('Pinta la respuesta',5)+`<div class="panel"><p>Resuelve la operación y toca la cantidad de partes del resultado.</p><div class="equation">${f(a,d)} ${op} ${f(b,d)} = ?</div>${bar(d,0,0,false,true)}<p id="paintcount">Pintaste 0 de ${d} partes.</p><button class="primary" onclick="checkPaint()">Comprobar</button><div id="feedback" aria-live="polite"></div></div>`}if(game===1){let q=detectives[round];app.innerHTML=gameHead('Detective de errores',4)+`<div class="panel"><h2>${q.q}</h2><div class="choices">${q.o.map((o,i)=>`<button onclick="detect(${i})">${o}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div></div>`}if(game===2){let[a,b,d,c]=hidden[round];app.innerHTML=gameHead('La fracción escondida',5)+`<div class="panel"><p>¿Qué numerador falta? Conserva el denominador.</p><div class="equation">${f(a,d)} − <span class="fraction"><span><input id="missing" type="number" min="0" max="${d}" aria-label="Numerador que falta"></span><span>${d}</span></span> = ${f(c,d)}</div><button class="primary" onclick="checkHidden()">Descubrir</button><div id="feedback" aria-live="polite"></div></div>`}}
function paint(i){if(locked)return;selected.has(i)?selected.delete(i):selected.add(i);let el=document.querySelectorAll('.cell')[i];el.classList.toggle('a');el.setAttribute('aria-pressed',selected.has(i));$('#paintcount').textContent=`Pintaste ${selected.size} de ${paints[round][2]} partes.`}
function result(ok,explanation){locked=true;if(ok)points++;tone(ok);$('#feedback').innerHTML=`<div class="feedback ${ok?'ok pop':'no'}"><b>${ok?'¡Muy bien!':'Vamos a entenderlo.'}</b> ${explanation}</div><div class="actions"><button class="primary" onclick="round++;renderGame()">Siguiente →</button></div>`}
function checkPaint(){if(locked)return;let[a,b,d,op]=paints[round],r=op==='+'?a+b:a-b;result(selected.size===r,`${a} ${op} ${b} = ${r}. Debes pintar ${r} de las ${d} partes: ${r}/${d}.`)}
function detect(i){if(locked)return;let q=detectives[round];result(i===q.a,q.e)}function checkHidden(){if(locked)return;if($('#missing').value===''){toast('Escribe un numerador primero');return}let[a,b,d,c]=hidden[round];result(+$('#missing').value===b,`${a} − ${b} = ${c}. La fracción escondida es ${b}/${d}. Comprueba: ${c}/${d} + ${b}/${d} = ${a}/${d}.`)}
let matchPick=null,matched=new Set();const pairs=[['3/7 + 2/7','5/7'],['10/12 − 7/12','3/12'],['5/8 − 4/8','1/8'],['3/5 + 2/5','5/5'],['7/10 + 2/10','9/10']];function matchGame(){matched=new Set();matchPick=null;app.innerHTML=`<button onclick="games()">← Todos los juegos</button>`+heading('JUEGO DE PAREJAS','Cada operación tiene su pareja','Toca una operación y después su resultado. Puedes volver a intentarlo.')+`<div class="panel"><div class="match">${pairs.map((p,i)=>`<button id="left${i}" onclick="matchLeft(${i})">${p[0]}</button><button id="right${[2,4,0,1,3][i]}" onclick="matchRight(${[2,4,0,1,3][i]})">${pairs[[2,4,0,1,3][i]][1]}</button>`).join('')}</div><div id="feedback" aria-live="polite" class="feedback">0 de 5 parejas encontradas.</div></div>`}function matchLeft(i){if(matched.has(i))return;document.querySelectorAll('.match .selected').forEach(el=>el.classList.remove('selected'));matchPick=i;$('#left'+i).classList.add('selected')}
function matchRight(i){if(matched.has(i))return;if(matchPick===null){toast('Elige primero una operación');return}if(i===matchPick){matched.add(i);$('#left'+i).className='matched';$('#right'+i).className='matched';$('#left'+i).disabled=true;$('#right'+i).disabled=true;matchPick=null;tone();$('#feedback').innerHTML=matched.size===5?'¡Encontraste todas! <button onclick="games()">Elegir otro juego</button>':`${matched.size} de 5 parejas encontradas.`}else{tone(false);$('#feedback').textContent='Todavía no. Calcula los numeradores y conserva el denominador. Inténtalo otra vez.'}}

function examStart(){exam=false;app.innerHTML=heading('MISIÓN 04 · PREPÁRATE','Ensaya antes de la prueba','Una práctica para descubrir lo que ya dominas y lo que puedes reforzar.')+`<div class="panel"><span class="tag">12 PREGUNTAS · SIN LÍMITE DE TIEMPO</span><h2>¡Tú puedes hacerlo!</h2><p>Encontrarás sumas, restas, fracciones que faltan y problemas del material. Elige una respuesta en cada pregunta. Al terminar verás tu resultado y la explicación de cada ejercicio.</p><div class="feedback"><b>Antes de responder:</b> lee qué te preguntan, identifica los datos y decide si debes juntar, quitar o completar un entero.</div><p class="small muted">Es una práctica de estudio basada en el PDF; no es la prueba oficial del colegio.</p><button class="primary" onclick="beginExam()">Comenzar práctica →</button></div>`}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function beginExam(){exam=true;questions=shuffle(bank).map(q=>{let opts=q.o.map((v,i)=>({v,correct:i===q.a}));opts=shuffle(opts);return {...q,o:opts.map(o=>o.v),a:opts.findIndex(o=>o.correct)}});answers=Array(questions.length).fill(null);round=0;examQuestion()}
function examQuestion(){let q=questions[round];app.innerHTML=heading('PRÁCTICA · PREGUNTA '+(round+1)+' DE '+questions.length,'Piensa con calma','Puedes retroceder y revisar tus respuestas antes de finalizar.')+`<div class="progress" role="progressbar" aria-valuenow="${round+1}" aria-valuemin="0" aria-valuemax="${questions.length}" aria-label="Avance de la práctica"><i style="width:${(round+1)/questions.length*100}%"></i></div><div class="panel"><h2>${q.q}</h2><div class="choices">${q.o.map((o,i)=>`<button style="${answers[round]===i?'border-color:#2556dc;background:#e7eeff':''}" aria-pressed="${answers[round]===i}" onclick="answers[round]=${i};examQuestion()">${o}</button>`).join('')}</div><div class="actions">${round>0?'<button onclick="round--;examQuestion()">← Anterior</button>':''}<button class="primary" ${answers[round]===null?'disabled':''} onclick="${round<questions.length-1?'round++;examQuestion()':'examResult()'}">${round<questions.length-1?'Siguiente →':'Ver mi resultado'}</button></div></div>`}
function examResult(){exam=false;let score=questions.filter((q,i)=>answers[i]===q.a).length,weak=[...new Set(questions.filter((q,i)=>answers[i]!==q.a).map(q=>q.t))];tone(score>=8);app.innerHTML=heading('PRÁCTICA TERMINADA',score===12?'¡Dominaste las fracciones!':'Cada intento te hace avanzar','Ahora revisa las explicaciones para aprender de tus respuestas.')+`<div class="panel"><div class="score">${score} <span class="muted" style="font-size:24px">/ 12 aciertos</span></div><p>${weak.length?'Te conviene repasar: <b>'+weak.join(', ')+'</b>.':'¡Muy bien! Explica con tus palabras por qué conservamos el denominador.'}</p><div class="actions"><button class="primary" onclick="beginExam()">Practicar otra vez</button><button onclick="lesson=0;stage=0;nav(0)">Repasar las lecciones</button></div></div>${questions.map((q,i)=>`<div class="panel"><span class="tag">${answers[i]===q.a?'✓ CORRECTA':'↻ PARA REPASAR'} · ${q.t}</span><h3>${i+1}. ${q.q}</h3><p>Tu respuesta: <b>${q.o[answers[i]]}</b></p><div class="feedback ${answers[i]===q.a?'ok':'no'}">${q.e}</div></div>`).join('')}`}
